# pyproject.toml

# ===================================================================
# Ruff (Linter + Formatter)
# 核心代码质量工具，集成了数十种工具，速度极快。
# 负责：代码风格检查、自动格式化、导入排序、坏味道重构等。
# ===================================================================
[tool.ruff]
required-version = ">=0.6.0"
# 设置与 Black 兼容的行长。
line-length = 88
# 指定你的项目支持的最低 Python 版本。
target-version = "py312"

# 指定 Ruff 需要检查的源代码和测试目录。
src = ["packages", "packages/apps", "scripts"]

# 全局排除不需要检查的文件和目录。
exclude = [
    ".bzr",
    ".claude",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".nox",
    ".pants.d",
    ".pixi",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "build",
    "dist",
    "node_modules",
    "venv",
    "scripts/learning",
]

cache-dir = ".ruff_cache"
respect-gitignore = true
force-exclude = true

# --- Ruff Linter (检查器) 配置 ---
[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "C90",
    "I",
    "N",
    "UP",
    "B",
    "A",
    "C4",
    "SIM",
    "PTH",
    "PLC",
    "PLE",
    "PLR",
    "PLW",
    "RUF",
    "D",
    "PT",
    "ANN",
    "S",
    "T20",
]

ignore = [
    "B008",   # 允许函数调用作为默认参数（FastAPI Depends）
    "N803",   # 函数参数命名：第三方库适配（numpy 矩阵变量等）
    "N806",   # 函数内变量命名：数学/科学计算常量（X, XtX, CONVERGENCE_TOL 等）
    "N818",   # DittoException 基类命名是设计选择
    "RUF002", # 中文标点符号
    "RUF003", # 中文注释标点符号
    "D203",   # 与 Black 冲突
    "D212",   # 与 Black 冲突
    "D100",   # 模块必须有文档字符串
    "D107",   # __init__ 文档字符串
    "D400",   # 文档字符串句号结尾（中文不适用）
    "D415",   # 文档字符串首行标点
    "D401",   # 祈使语气
    "PT011",  # pytest.raises match 参数
    "SIM105", # contextlib.suppress
    "SIM117", # 嵌套 with 语句
]

unfixable = []

[tool.ruff.lint.per-file-ignores]
# SignalDelivery - 环境变量名（非实际密钥）是 Bandit S105 已知误报
"packages/apps/src/ditto_apps/registry/infra/signal_delivery.py" = ["S105"]
# MetadataService.__init__ - 构造器注入 16 个依赖，参数数量不可避免
"packages/data/src/ditto_data/services/metadata_service.py" = ["PLR0913"]
# DerivedArtifactReader.read_frame - @overload 模式下无法拆分参数
"packages/data/src/ditto_data/services/derived/artifact_reader.py" = ["PLR0913"]
# MarketService.list_bars - 便利方法，参数透传到 MarketBarsQuery
"packages/data/src/ditto_data/services/market_service.py" = ["PLR0913"]
# ResearchDatasetFacade.export() - 表名来自系统 dataset_id，非用户输入
"packages/apps/src/ditto_apps/services/derived/research.py" = ["S608"]
# ResearchQuery.export() - 表名来自内部枚举，非用户输入
"packages/application/src/ditto_application/query/research.py" = ["S608"]
# EngineLoop.__init__ - DI 注入 8 个依赖，参数数量不可避免
"packages/engine/src/ditto_engine/backtest/engine.py" = ["PLR0913"]
# Protocol 属性用 ``...`` 省略体是标准惯例，D102 不适用
"packages/engine/src/ditto_engine/portfolio/report_views.py" = ["D102"]
# Protocol 接口方法用 ``...`` 省略体是标准惯例，D102 不适用
"packages/data/src/ditto_data/storage/base/protocols.py" = ["D102"]
# 第三方 stub 文件包含 Any 类型签名，无法修改
"typings/**/*.pyi" = ["ANN401"]

# 测试文件 - 最宽松（所有 tests/ 目录通用）
"**/tests/**/*.py" = [
    "PLR2004",
    "PLR0913",
    "S101",
    "S106",
    "S311",
    "S608",
    "ANN",
    "D",
    "PLC0415",
    "C901",
    "S105",
    "S108",
    "S110",
]
"**/conftest.py" = ["ANN", "D", "PLC0415"]

# 脚本文件
"scripts/**/*.py" = ["T201", "S101", "S603", "S607", "D", "ANN"]
"packages/apps/tests/scripts/**/*.py" = ["T201", "S101", "S603", "S607", "D", "ANN", "RUF001", "PLR0912", "PLR0915", "E501"]
"**/cli.py" = ["T201"]
"**/cli/*.py" = ["T201"]
"**/main.py" = ["T201"]

# __init__.py
"__init__.py" = ["D104"]

# provider.py - 延迟导入避免循环依赖
"**/sources/provider.py" = ["PLC0415"]

# 中文 description 中使用全角标点
"packages/data/src/ditto_data/quality/golden.py" = ["RUF001"]
"packages/data/src/ditto_data/sources/tushare/adapters/index.py" = ["RUF001"]
"packages/data/src/ditto_data/sources/tushare/adapters/fundamental.py" = ["RUF001"]

# Kernel tracing — Protocol __call__ 和通用装饰器签名不可避免使用 Any
"packages/kernel/src/ditto_kernel/tracing.py" = ["ANN401", "D102"]
# Observability bridge — 桥接函数签名需匹配 TraceHandler Protocol（Any）
"packages/apps/src/ditto_apps/registry/infra/observability.py" = ["ANN401"]

# E2E 测试
"packages/apps/tests/e2e/*.py" = ["S101", "PLR2004", "D", "ANN", "E501"]

# --- Ruff Formatter (格式化器) 配置 ---
[tool.ruff.format]
quote-style = "double"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.inline-snapshot]
format-command = "ruff format --stdin-filename {filename}"

[tool.ruff.lint.flake8-annotations]
suppress-none-returning = true
suppress-dummy-args = true

[tool.ruff.lint.pylint]
max-statements = 50
max-args = 7
max-branches = 12
max-returns = 6

[tool.ruff.lint.mccabe]
max-complexity = 10

# flake8-tidy-imports: 禁止特定 API 导入
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"pandas".msg = "Use polars instead"

# ===================================================================
# BasedPyright (类型检查) - Pyright fork，更严格的默认设置
#
# 策略：standard 打底 + 核心目录 strict
# 优势：
#   1. 避免全仓 strict 导致的噪音爆炸
#   2. 核心业务逻辑获得最严格检查
#   3. 边缘模块保持灵活性
#   4. 更多诊断规则默认启用，更好的 AI coding 支持
# ===================================================================
[tool.basedpyright]
pythonVersion = "3.13"
pythonPlatform = "All"
stubPath = "typings"

# 显式指定 pixi 虚拟环境，确保 VS Code 扩展和 pixi shell 都能正确定位
venvPath = ".pixi/envs"
venv = "dev"

# 核心：standard 模式打底（比 basic 严格，比 strict 宽松）
typeCheckingMode = "standard"

# 源码目录
include = ["packages/**/src"]

# 排除目录（tests 用独立配置）
exclude = [
    "**/__pycache__",
    "**/node_modules",
    ".pixi",
    ".venv",
    "build",
    "dist",
    "tests",
    "**/tests",
]

# VS Code 体验：tests 打开也不出红黄线（诊断被抑制）
ignore = [
    "tests",
    "tests/**",
    "**/tests/**",
    "packages/*/tests/**",
    "packages/apps/tests/**",
    # MarketQueryService: multi-line error message uses implicit string concatenation
    # (已迁移至 services/)
]

# ═══════════════════════════════════════════════════════════════════
# 关键：核心目录提升到 strict 模式
# 这些是最值钱的代码，值得最严格的检查
# ═══════════════════════════════════════════════════════════════════
strict = ["packages/**/src"]

# ═══════════════════════════════════════════════════════════════════
# 规则微调：让 Ruff 管风格，Pyright 专注类型
# ═══════════════════════════════════════════════════════════════════
# Ruff 已经管了这些
reportUnusedImport = "none"
reportUnusedVariable = "none"

# 第三方库 stub 不完整时的处理
reportMissingTypeStubs = "warning"

# 检测不必要的 type: ignore 注释
reportUnnecessaryTypeIgnoreComment = "error"

# 检测隐式字符串拼接
reportImplicitStringConcatenation = "error"

# 对于 standard 模式下的 Unknown 类型，降级为 warning
# 这样编辑器里能看到黄线提醒，但不会阻塞 CI
#reportUnknownMemberType = "warning"
#reportUnknownArgumentType = "warning"
#reportUnknownVariableType = "warning"

# 私有成员访问（测试和内部模块可能需要）
#reportPrivateUsage = "warning"

# 告诉 Pyright 源码根目录（解决 import 路径问题）
extraPaths = [
    "packages/engine/src",
    "packages/platform/src",
    "packages/kernel/src",
    "packages/data/src",
    "packages/analytics/src",
    "packages/application/src",
    "packages/apps/src",
]

# ===================================================================
# Pytest (测试框架)
# ===================================================================
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["packages/*/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = [
    "packages/engine/src",
    "packages/platform/src",
    "packages/kernel/src",
    "packages/data/src",
    "packages/analytics/src",
    "packages/application/src",
    "packages/apps/src",
]

filterwarnings = ["error", "ignore::UserWarning", "ignore::DeprecationWarning"]

markers = [
    "unit: Mark test as a unit test",
    "integration: Mark test as an integration test",
    "e2e: Mark test as an end-to-end test",
    "slow: Mark test as slow running (skip with -m 'not slow')",
    "serial: Mark test that must run serially",
    "snapshot: Mark test that uses inline-snapshot (must run serially)",
    "pit: Mark test as Point-in-Time validation (no future data leak)",
]

log_cli = true
log_cli_level = "INFO"
asyncio_mode = "strict"

addopts = [
    "-ra",
    "-v",
    "-n", "auto",           # 默认并行运行
    "--dist", "loadfile",   # 同文件测试串行（避免 snapshot 冲突）
    "--strict-markers",
    "--strict-config",
    "--cov=packages",
    "--cov-report=html:htmlcov",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-branch",
    "--cov-fail-under=80",
    "--durations=10",       # 报告最慢的 10 个测试
]

# ===================================================================
# Coverage
# ===================================================================
[tool.coverage.run]
branch = true
source = ["packages"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
    "@overload",
    "class .*\\bProtocol\\):",
    "if self\\.debug:",
    "logger\\.(debug|trace)",
]
fail_under = 80
partial_branches = ["pragma: no branch", "if TYPE_CHECKING:"]

[tool.coverage.html]
directory = "htmlcov"

# ===================================================================
# Commitizen 配置
# ===================================================================
[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
tag_format = "v$version"
version_files = [
    "packages/engine/src/ditto_engine/__init__.py:__version__",
    "packages/platform/src/ditto_platform/__init__.py:__version__",
    "packages/kernel/src/ditto_kernel/__init__.py:__version__",
    "packages/data/src/ditto_data/__init__.py:__version__",
]
update_changelog_on_bump = true
changelog_incremental = true
