# pyproject.toml

# ===================================================================
# Ruff (Linter + Formatter)
# 核心代码质量工具，集成了数十种工具，速度极快。
# 负责：代码风格检查、自动格式化、导入排序、坏味道重构等。
# ===================================================================
[tool.ruff]
required-version = ">=0.6.0"
# 设置与 Black 兼容的行长。
line-length = 88
# 指定你的项目支持的最低 Python 版本。
target-version = "py312"

# 指定 Ruff 需要检查的源代码和测试目录。
src = ["packages", "apps", "scripts", "tests"]

# 全局排除不需要检查的文件和目录。
exclude = [
    ".bzr",
    ".claude",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".nox",
    ".pants.d",
    ".pixi",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "build",
    "dist",
    "node_modules",
    "venv",
]

cache-dir = ".ruff_cache"
respect-gitignore = true
force-exclude = true

# --- Ruff Linter (检查器) 配置 ---
[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "C90",
    "I",
    "N",
    "UP",
    "B",
    "A",
    "C4",
    "SIM",
    "PTH",
    "PLC",
    "PLE",
    "PLR",
    "PLW",
    "RUF",
    "D",
    "PT",
    "ANN",
    "S",
    "T20",
]

ignore = [
    "B008",   # 允许函数调用作为默认参数（FastAPI Depends）
    "N803",
    "N806",
    "N818",
    "ANN401", # 允许 Any 类型注解
    "RUF002", # 中文标点符号
    "RUF003", # 中文注释标点符号
    "D203",   # 与 Black 冲突
    "D212",   # 与 Black 冲突
    "D100",   # 模块必须有文档字符串
    "D107",   # __init__ 文档字符串
    "D400",   # 文档字符串句号结尾（中文不适用）
    "D415",   # 文档字符串首行标点
    "D401",   # 祈使语气
    "PT011",  # pytest.raises match 参数
    "SIM105", # contextlib.suppress
    "SIM117", # 嵌套 with 语句
]

unfixable = []

[tool.ruff.lint.per-file-ignores]
# MetadataStore batch_get_by_codes - 参数化查询，使用 ? 占位符
"packages/datahub/src/ditto_datahub/domains/macro/indicator/metadata_store.py" = ["S608"]
"packages/datahub/src/ditto_datahub/domains/features/technical/indicator_metadata_store.py" = ["S608"]
"packages/datahub/src/ditto_datahub/domains/factors/factor_metadata_store.py" = ["S608"]

# 测试文件 - 最宽松
"tests/**/*.py" = [
    "PLR2004",
    "PLR0913",
    "S101",
    "S106",
    "S311",
    "S608",
    "ANN",
    "D",
    "PLC0415",
    "C901",
    "S105",
    "S108",
    "S110",
]
"**/tests/**/*.py" = [
    "PLR2004",
    "PLR0913",
    "S101",
    "S106",
    "S311",
    "S608",
    "ANN",
    "D",
    "PLC0415",
    "C901",
    "S105",
    "S108",
    "S110",
]
"**/conftest.py" = ["ANN", "D", "PLC0415"]

# 脚本文件
"scripts/**/*.py" = ["T201", "S101", "S603", "S607", "D", "ANN"]
"**/cli.py" = ["T201"]
"**/cli/*.py" = ["T201"]
"**/main.py" = ["T201"]

# __init__.py
"__init__.py" = ["D104"]

# provider.py - 延迟导入避免循环依赖
"**/sources/provider.py" = ["PLC0415"]

# --- Ruff Formatter (格式化器) 配置 ---
[tool.ruff.format]
quote-style = "double"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.flake8-annotations]
ignore-fully-untyped = true
suppress-none-returning = true
suppress-dummy-args = true

[tool.ruff.lint.pylint]
max-statements = 50
max-args = 7
max-branches = 12
max-returns = 6

[tool.ruff.lint.mccabe]
max-complexity = 10

# ===================================================================
# BasedPyright (类型检查) - Pyright fork，更严格的默认设置
#
# 策略：standard 打底 + 核心目录 strict
# 优势：
#   1. 避免全仓 strict 导致的噪音爆炸
#   2. 核心业务逻辑获得最严格检查
#   3. 边缘模块保持灵活性
#   4. 更多诊断规则默认启用，更好的 AI coding 支持
# ===================================================================
[tool.basedpyright]
pythonVersion = "3.12"
pythonPlatform = "All"
stubPath = "typings"

# 核心：standard 模式打底（比 basic 严格，比 strict 宽松）
typeCheckingMode = "standard"

# 源码目录
include = ["packages/**/src", "apps/**/src"]

# 排除目录（tests 用独立配置）
exclude = [
    "**/__pycache__",
    "**/node_modules",
    ".pixi",
    ".venv",
    "build",
    "dist",
    "tests",
    "**/tests",
]

# VS Code 体验：tests 打开也不出红黄线（诊断被抑制）
ignore = [
    "tests",
    "tests/**",
    "**/tests/**",
    "packages/*/tests/**",
    "apps/*/tests/**",
    # StockAdjFactorStore and ETF stores intentionally change API to remove dataset parameter
    # This is a domain-specific specialization that hardcodes the dataset name
    "packages/datahub/src/ditto_datahub/domains/market/stock/adj/adj_factor_store.py",
    "packages/datahub/src/ditto_datahub/domains/market/etf/bars/bars_store.py",
    "packages/datahub/src/ditto_datahub/domains/market/etf/status/status_store.py",
    "packages/datahub/src/ditto_datahub/domains/market/etf/nav/nav_store.py",
    "packages/datahub/src/ditto_datahub/domains/market/etf/adj/adj_factor_store.py",
    # MarketQueryService: multi-line error message uses implicit string concatenation
    "packages/datahub/src/ditto_datahub/domains/market/market_query_service.py",
]

# ═══════════════════════════════════════════════════════════════════
# 关键：核心目录提升到 strict 模式
# 这些是最值钱的代码，值得最严格的检查
# ═══════════════════════════════════════════════════════════════════
strict = ["packages/**/src", "apps/port/**/src"]

# ═══════════════════════════════════════════════════════════════════
# 规则微调：让 Ruff 管风格，Pyright 专注类型
# ═══════════════════════════════════════════════════════════════════
# Ruff 已经管了这些
reportUnusedImport = "none"
reportUnusedVariable = "none"

# 第三方库 stub 不完整时的处理
reportMissingTypeStubs = "warning"

# 检测不必要的 type: ignore 注释
reportUnnecessaryTypeIgnoreComment = "error"

# 检测隐式字符串拼接
reportImplicitStringConcatenation = "error"

# 对于 standard 模式下的 Unknown 类型，降级为 warning
# 这样编辑器里能看到黄线提醒，但不会阻塞 CI
#reportUnknownMemberType = "warning"
#reportUnknownArgumentType = "warning"
#reportUnknownVariableType = "warning"

# 私有成员访问（测试和内部模块可能需要）
#reportPrivateUsage = "warning"

# 告诉 Pyright 源码根目录（解决 import 路径问题）
extraPaths = [
    "packages/core/src",
    "packages/foundation/src",
    "packages/datahub/src",
    "apps/port/src",
]

# ===================================================================
# Pytest (测试框架)
# ===================================================================
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["packages/*/tests", "apps/*/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = [
    "packages/core/src",
    "packages/foundation/src",
    "packages/datahub/src",
    "apps/port/src",
]

filterwarnings = ["error", "ignore::UserWarning", "ignore::DeprecationWarning"]

markers = [
    "unit: Mark test as a unit test",
    "integration: Mark test as an integration test",
    "slow: Mark test as slow running (skip with -m 'not slow')",
    "serial: Mark test that must run serially",
    "snapshot: Mark test that uses inline-snapshot (must run serially)",
]

log_cli = true
log_cli_level = "INFO"
asyncio_mode = "strict"

addopts = [
    "-ra",
    "-v",
    "-n", "auto",           # 默认并行运行
    "--dist", "loadfile",   # 同文件测试串行（避免 snapshot 冲突）
    "--strict-markers",
    "--strict-config",
    "--cov=packages",
    "--cov=apps",
    "--cov-report=html:htmlcov",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-branch",
    "--cov-fail-under=80",
    "--durations=10",       # 报告最慢的 10 个测试
]

# ===================================================================
# Coverage
# ===================================================================
[tool.coverage.run]
branch = true
source = ["packages", "apps"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
    "@overload",
    "class .*\\bProtocol\\):",
    "if self\\.debug:",
    "logger\\.(debug|trace)",
]
fail_under = 80
partial_branches = ["pragma: no branch", "if TYPE_CHECKING:"]

[tool.coverage.html]
directory = "htmlcov"

# ===================================================================
# Commitizen 配置
# ===================================================================
[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
tag_format = "v$version"
version_files = [
    "packages/core/src/ditto_core/__init__.py:__version__",
    "packages/foundation/src/ditto_foundation/__init__.py:__version__",
    "packages/datahub/src/ditto_datahub/__init__.py:__version__",
]
update_changelog_on_bump = true
changelog_incremental = true
