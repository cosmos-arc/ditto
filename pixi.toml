# pixi.toml - Ditto 量化系统依赖配置
#
# 设计原则：
# - 运行时依赖与开发依赖分离
# - 版本约束适度（不过严也不过松）
# - dev 环境继承 default，确保版本一致

[workspace]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64"]
name = "ditto"
version = "0.1.0"
authors = ["Chevy <chevy_777@126.com>"]
description = "Quantitative Investment System for Volatile Market Conditions"
readme = "README.md"

# ==========================================================
# 运行时依赖（生产环境需要的）
# ==========================================================
[dependencies]
python = "3.12.*"

# 数据科学与处理
polars = ">=1.8,<2"
pandas = ">=2.2,<3"
numpy = ">=2.1,<3"
pyarrow = ">=18,<23"

# 数据库
duckdb = ">=1.1,<2"

# Web 框架与 API
fastapi = ">=0.115,<1"
pydantic = ">=2.9,<3"
pydantic-settings = ">=2.6,<3"

# 网络请求
httpx = ">=0.28,<1"
aiohttp = ">=3.11,<4"

# 配置与日志
python-dotenv = ">=1.0,<2"
loguru = ">=0.7,<1"
pyyaml = ">=6.0,<7"

# 任务调度
prefect = ">=3.0,<4"
apscheduler = ">=3.11,<4"

# 可视化
matplotlib = ">=3.9,<4"

# ==========================================================
# PyPI 依赖
# ==========================================================
[pypi-dependencies]
# 本地包（editable 安装）
ditto-core = { path = "packages/core", editable = true }
ditto-foundation = { path = "packages/foundation", editable = true }
ditto-datahub = { path = "packages/datahub", editable = true }
ditto-port = { path = "apps/port", editable = true }

# 性能优化库
cachebox = ">=5.0,<6"
granian = ">=1.0,<2"
orjson = ">=3.10,<4"
xxhash = ">=3.5,<4"

# 数据源
akshare = ">=1.15,<2"

# 文件锁
filelock = ">=3.16,<4"

# OpenTelemetry
opentelemetry-api = ">=1.28,<2"
opentelemetry-sdk = ">=1.28,<2"
opentelemetry-exporter-otlp-proto-http = ">=1.28,<2"

# 其他
uuid7 = ">=0.1,<1"
tenacity = ">=8.0,<9"
limits = ">=3.15"
keyring = ">=25.0,<26"
typer = ">=0.12,<1"

# ==========================================================
# 开发环境 Feature
# ==========================================================
[feature.dev.dependencies]
# 代码质量工具
ruff = ">=0.8,<1"
pre-commit = ">=4.0,<5"

# 测试框架
pytest = ">=8.0,<9"
pytest-cov = ">=6.0,<7"
pytest-asyncio = ">=0.24,<1"
pytest-mock = ">=3.14,<4"
pytest-benchmark = ">=4.0,<5"
pytest-xdist = ">=3.5,<4"
pytest-timeout = ">=2.3,<3"
requests-mock = ">=1.12,<2"
inline-snapshot = ">=0.10"
hypothesis = ">=6.100"
respx = ">=0.21"

# 测试辅助
faker = ">=33,<40"
pandera = ">=0.21,<1"

# 类型存根
types-requests = ">=2.32,<3"
types-pyyaml = ">=6.0,<7"
types-python-dateutil = ">=2.9,<3"

# 开发工具
ipykernel = ">=6.29,<7"
jupyter = ">=1.1,<2"

[feature.dev.pypi-dependencies]
# Pyright 类型检查（替代 mypy）
pyright = ">=1.1.390,<2"

# ==========================================================
# 环境定义
# ==========================================================
[environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

# ==========================================================
# 任务定义
# ==========================================================
[tasks]
# ──────────────────────────────────────────────────────────
# 代码质量
# ──────────────────────────────────────────────────────────
# Lint：代码检查
lint = "ruff check ."

# Format：代码格式化
fmt = "ruff format ."

# Type：类型检查（使用包装脚本）
type = "python scripts/type.py"

# ──────────────────────────────────────────────────────────
# 测试（使用包装脚本，支持参数驱动）
# ──────────────────────────────────────────────────────────
# pixi run test              # 默认：单元测试（并行）
# pixi run test --unit       # 只跑单元测试（并行）
# pixi run test --integration # 只跑集成测试（串行）
# pixi run test --fast       # 快速测试（跳过 slow/integration/e2e）
# pixi run test --cov        # 带覆盖率报告
# pixi run test --cov-xml    # 覆盖率 XML（CI 用）
# pixi run test --snapshot   # 支持 inline-snapshot（串行）
test = "python scripts/test.py"

# ──────────────────────────────────────────────────────────
# 组合命令
# ──────────────────────────────────────────────────────────
# Check：快速验证（开发时用）
check = { depends-on = ["lint", "fmt", "type", "test-fast"] }

# CI：完整检查（CI 用）
ci = { depends-on = ["lint", "fmt-check", "type-all", "test-cov-xml"] }

# ──────────────────────────────────────────────────────────
# 辅助命令
# ──────────────────────────────────────────────────────────
# Dev：开发服务（热重载）
dev = "granian apps.port.src.ditto_port.main:app --interface asgi --reload --host 0.0.0.0 --port 8000"

# Server：生产服务
server = "granian apps.port.src.ditto_port.main:app --interface asgi --host 0.0.0.0 --port 8000 --workers 4"

# Clean：清理缓存
clean = """
rm -rf dist/ build/ *.egg-info \
    .pytest_cache .ruff_cache \
    htmlcov .coverage coverage.xml \
    **/__pycache__
"""

# ──────────────────────────────────────────────────────────
# Pre-commit 工具
# ──────────────────────────────────────────────────────────
pre-commit-install = "pre-commit install --hook-type commit-msg --hook-type pre-commit --hook-type pre-push"
pre-commit-run = "pre-commit run --all-files"
pre-commit-update = "pre-commit autoupdate"
