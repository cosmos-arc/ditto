# pixi.toml - Ditto 量化系统依赖配置
#
# 设计原则：
# - 运行时依赖与开发依赖分离
# - 版本约束适度（不过严也不过松）
# - dev 环境继承 default，确保版本一致
# - 所有依赖必须有上界

[workspace]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-arm64"]
requires-pixi = ">=0.73,<0.74"
name = "ditto"
version = "0.1.0"
authors = ["Chevy <chevy_777@126.com>"]
description = "Quantitative Investment System for Volatile Market Conditions"
readme = "README.md"

# ==========================================================
# 运行时依赖（生产环境需要的）
# ==========================================================
[dependencies]
python = "3.13.*"

# 数据科学与处理
numpy = ">=2.0,<3"
polars = ">=1.9,<2"

# 数据库
duckdb = ">=1.3,<2"

# Web 框架与 API
fastapi = ">=0.115,<0.137"
pydantic = ">=2.10,<3"
pydantic-settings = ">=2.10,<3"

# 网络请求
httpx = ">=0.28,<1"

# 配置与日志
python-dotenv = ">=1.0,<2"
loguru = ">=0.7,<1"
pyyaml = ">=6.0,<7"
typer = "==0.27.1"

# 任务调度
prefect = ">=3.4,<4"
lupa = ">=2.1,<3"

# ==========================================================
# PyPI 依赖
# ==========================================================
[pypi-dependencies]
# 本地包（editable 安装）
ditto-application = { path = "packages/application", editable = true }
ditto-agent = { path = "packages/agent", editable = true }
ditto-data = { path = "packages/data", editable = true }
ditto-platform = { path = "packages/platform", editable = true }
ditto-kernel = { path = "packages/kernel", editable = true }
ditto-features = { path = "packages/features", editable = true }
ditto-analysis = { path = "packages/analysis", editable = true }
ditto-strategy = { path = "packages/strategy", editable = true }
ditto-portfolio = { path = "packages/portfolio", editable = true }
ditto-risk = { path = "packages/risk", editable = true }
ditto-execution = { path = "packages/execution", editable = true }
ditto-backtest = { path = "packages/backtest", editable = true }
ditto-apps = { path = "apps/backend", editable = true }

# 性能优化库
cachebox = ">=5.0,<6"
granian = ">=2.0,<3"
orjson = ">=3.10,<4"
xxhash = ">=3.5,<4"

# 文件锁
filelock = ">=3.16,<4"

# OpenTelemetry
opentelemetry-api = ">=1.28,<2"
opentelemetry-sdk = ">=1.28,<2"
opentelemetry-exporter-otlp-proto-http = ">=1.28,<2"

# 其他
tenacity = ">=9.0,<10"
limits = ">=3.5,<6"
keyring = ">=25.0,<26"
openai-agents = ">=0.20.0,<0.21"

# 依赖注入
dishka = ">=1.8,<2"

# 架构约束检查
import-linter = ">=2.6,<3"

# SOCKS 代理支持（httpx 需要）
socksio = ">=1.0,<2"

# ==========================================================
# 开发环境 Feature
# ==========================================================
[feature.dev.dependencies]
# 代码质量工具
# Keep lint/format semantics identical across Linux, Windows, and Apple Silicon.
ruff = "==0.15.11"
pre-commit = ">=4.0,<5"

# 测试框架
pytest = ">=9.0,<10"
pytest-cov = ">=7.0,<8"
pytest-asyncio = ">=1.0,<2"
pytest-mock = ">=3.14,<4"
pytest-xdist = ">=3.6,<4"
pytest-timeout = ">=2.3,<3"
inline-snapshot = ">=0.10,<1"
hypothesis = ">=6.100,<7"
respx = ">=0.21,<1"

# 类型存根
types-pyyaml = ">=6.0,<7"
types-python-dateutil = ">=2.9,<3"

# 开发工具
ipykernel = ">=6.29,<7"
jupyter = ">=1.1,<2"
"keyrings.alt" = ">=5.0.2,<6"

[feature.dev.pypi-dependencies]
# BasedPyright 类型检查（Pyright fork，更严格的默认设置）
basedpyright = ">=1.29,<2"
# coverage — conda-forge 包损坏（无 .py 文件），使用 PyPI 版本
coverage = ">=7.6,<8"
# API schema property testing; exact pin keeps generated cases reproducible.
schemathesis = "==4.25.2"
# Weekly mutation testing for critical deterministic domain functions.
mutmut = "==3.7.0"

# ==========================================================
# 环境定义
# ==========================================================
[environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

# ==========================================================
# 开发环境专属任务
# ==========================================================
[feature.dev.tasks]
# 分析慢速测试
analyze-slow-tests = "python scripts/analyze_slow_tests.py"

# ==========================================================
# 任务定义
# ==========================================================
[tasks]
# ──────────────────────────────────────────────────────────
# 代码质量
# ──────────────────────────────────────────────────────────
# Lint：代码检查
lint = "ruff check ."

# Lint imports：架构边界检查（Import Linter）
lint-imports = "lint-imports"

# Format：代码格式化
fmt = "ruff format ."

# Format check：只检查不修改（供 CI 使用）
fmt-check = "ruff format --check ."

# Type：类型检查（使用包装脚本，参数驱动）
type = "python scripts/type.py"

# Type all：完整类型检查（供 CI 使用，始终清除缓存）
type-all = "python scripts/type.py --all --clean"

# Architecture smell check：架构坏味道检查（f-string 日志、缺失 __init__.py、超大文件）
arch-smells = "python scripts/architecture/check_architecture_smells.py"

# Architecture check：架构边界检查（Import Linter + smell 检查）
arch-check = { depends-on = ["lint-imports", "arch-smells"] }

# ──────────────────────────────────────────────────────────
# 测试（使用包装脚本，支持参数驱动）
# ──────────────────────────────────────────────────────────
# pixi run test              # 默认：单元测试（并行）
# pixi run test --unit       # 只跑单元测试（并行）
# pixi run test --integration # 只跑集成测试（串行）
# pixi run test --fast       # 快速测试（跳过 slow/integration）
# pixi run test --cov        # 带覆盖率报告
# pixi run test --cov-xml    # 覆盖率 XML（CI 用）
# pixi run test --snapshot   # 支持 inline-snapshot（串行）
test = "python scripts/test.py"

# Test with coverage XML（供 CI 使用）
test-cov-xml = "python scripts/test.py --cov-xml"
backend-coverage = "python scripts/test.py --cov-xml && python tooling/quality/coverage_gate.py --report coverage.json"

# Test fast（快速测试，用于 check 命令）
test-fast = "python scripts/test.py --fast"

# PIT correctness suite must remain explicit and cannot skip for local fixtures.
pit = "pytest -m pit -q -n0 --no-cov"

# Agent Harness：宿主配置验证与 policy/工具回归
sync-agent-skills = "python tooling/agent_harness/sync_skills.py"
harness-validate = "python tooling/agent_harness/validate.py"
integrator-lease = "python -m tooling.agent_harness.lease"
harness-test = "python -m unittest discover -s tooling/agent_harness/tests -v"
tooling-test = "pytest tooling/dev/tests tooling/contracts/tests tooling/quality/tests -q -n0 --no-cov"
harness-type = "basedpyright tooling/agent_harness"
large-file-check = "python -m tooling.quality.large_files"
harness-check = { depends-on = [
    "harness-validate",
    "harness-test",
    "tooling-test",
    "harness-type",
    "large-file-check",
] }
check-changed = "python tooling/agent_harness/hook.py --event check-changed"
package-contract-check = "python tooling/quality/package_contracts.py"

# 根工具链与 Bun workspace
toolchain-check = "python tooling/dev/toolchain.py"
bun-install = "bun ci --frozen-lockfile"
contract-toolchain-bootstrap = "python -m tooling.contracts.bootstrap_oasdiff"
bootstrap = { depends-on = [
    "toolchain-check",
    "bun-install",
    "contract-toolchain-bootstrap",
] }

# Web 叶子任务；Bun 不定义跨栈 DAG
web-lint = { cmd = "bun run lint", cwd = "apps/web" }
web-type = { cmd = "bun run type", cwd = "apps/web" }
web-test = { cmd = "bun run test:unit", cwd = "apps/web" }
web-build = { cmd = "bun run build", cwd = "apps/web" }
web-product-check = { cmd = "bun run audit:routes", cwd = "apps/web" }
web-token-check = { cmd = "bun run audit:tokens:dead-links --ci", cwd = "apps/web" }
web-architecture = { cmd = "bun run arch:check", cwd = "apps/web" }
web-coverage = { cmd = "bun run test:coverage", cwd = "apps/web" }
web-prototype = { cmd = "bun run test:prototype", cwd = "apps/web" }
web-manifest-check = "python tooling/quality/web_manifest_freshness.py"
web-static = { depends-on = ["web-lint", "web-type", "web-product-check", "web-token-check", "web-architecture"] }
check-web = { depends-on = ["web-static", "web-test"] }
web-ci = { depends-on = ["web-static", "web-coverage", "web-prototype", "web-build"] }

# OpenAPI 与真实双栈验收
contract-static = "python -m tooling.contracts.check_contract"
contract-conformance = "pytest apps/backend/tests/contract/test_openapi_conformance.py -q -n0 --no-cov"
cohort-compatibility-check = "python -m tooling.release.compatibility_policy validate"
check-contract = { depends-on = [
    "contract-static",
    "contract-conformance",
    "cohort-compatibility-check",
] }
test-system = "python -m tooling.dev.system_tests"

# 每周关键纯函数 mutation 门；在临时统一 src 森林内运行，避免多包假阴性。
mutation-critical = "python -m tooling.quality.mutation_gate --threshold 80"

# Reproducible local counterparts of the hosted supply-chain and artifact jobs.
# Both fail closed when Docker is unavailable; the full ``ci`` contract therefore
# never reports success without scanning the exact source tree and built image.
security-supply-chain = "python -m tooling.security.supply_chain"
artifact-gate = { cmd = "python -m tooling.release.artifact_gate", depends-on = ["web-ci"] }

# Cross-platform behavior slices used by the Windows support gate.  The API
# smoke starts the real composition root with disposable config/state/cache.
platform-backend-unit = "pytest packages/kernel/tests/unit/test_identity.py apps/backend/tests/unit/test_main_unit.py apps/backend/tests/unit/test_loopback_binding_unit.py apps/backend/tests/unit/cli/commands/test_init_unit.py -q -n0 --no-cov"
platform-web-unit = { cmd = "bun run vitest run src/api/compatibility.test.ts src/api/runtime-config.test.ts", cwd = "apps/web" }
platform-api-smoke = "python -m tooling.dev.platform_smoke"

# ──────────────────────────────────────────────────────────
# 组合命令
# ──────────────────────────────────────────────────────────
# 后端快速门
check-backend = { depends-on = [
    "package-contract-check",
    "lint",
    "fmt-check",
    "type",
    "test-fast",
    "arch-check",
] }

# Check：唯一跨栈快速门
check = { depends-on = [
    "check-backend",
    "check-web",
    "check-contract",
    "harness-check",
] }

# 后端完整门
backend-ci = { depends-on = [
    "package-contract-check",
    "lint",
    "fmt-check",
    "type-all",
    "backend-coverage",
    "pit",
    "arch-check",
] }

# CI：唯一跨栈完整门
ci = { depends-on = [
    "backend-ci",
    "check-contract",
    "test-system",
    "harness-check",
    "security-supply-chain",
    "artifact-gate",
] }

# ──────────────────────────────────────────────────────────
# 辅助命令
# ──────────────────────────────────────────────────────────
# Dev：隔离、受监督的 API + Web 服务
dev = "python -m tooling.dev.supervisor"

# Server：生产服务
server = "python -m ditto_apps.server ditto_apps.main:app --interface asgi --host 127.0.0.1 --port 8000 --workers 4"

# Clean：清理缓存
clean = """
rm -rf dist/ build/ *.egg-info \
    .pytest_cache .ruff_cache \
    htmlcov .coverage coverage.xml \
    **/__pycache__
"""

# ──────────────────────────────────────────────────────────
# Pre-commit 工具
# ──────────────────────────────────────────────────────────
pre-commit-install = "pre-commit install --hook-type commit-msg --hook-type pre-commit --hook-type pre-push"
pre-commit-run = "pre-commit run --all-files"
pre-commit-update = "pre-commit autoupdate"
