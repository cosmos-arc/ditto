# pixi.toml - Ditto 量化系统依赖配置
#
# 设计原则：
# - 运行时依赖与开发依赖分离
# - 版本约束适度（不过严也不过松）
# - dev 环境继承 default，确保版本一致

[workspace]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64"]
name = "ditto"
version = "0.1.0"
authors = ["Chevy <chevy_777@126.com>"]
description = "Quantitative Investment System for Volatile Market Conditions"
readme = "README.md"

# ==========================================================
# 运行时依赖（生产环境需要的）
# ==========================================================
[dependencies]
python = "3.12.*"

# 数据科学与处理
polars = ">=1.8,<2"
pandas = ">=2.2,<3"
numpy = ">=2.1,<3"
pyarrow = ">=18,<23"

# 数据库
duckdb = ">=1.1,<2"

# Web 框架与 API
fastapi = ">=0.115,<1"
pydantic = ">=2.9,<3"
pydantic-settings = ">=2.6,<3"

# 网络请求
httpx = ">=0.28,<1"
aiohttp = ">=3.11,<4"

# 配置与日志
python-dotenv = ">=1.0,<2"
loguru = ">=0.7,<1"
pyyaml = ">=6.0,<7"

# 任务调度
prefect = ">=3.0,<4"
apscheduler = ">=3.11,<4"

# 可视化
matplotlib = ">=3.9,<4"

# ==========================================================
# PyPI 依赖
# ==========================================================
[pypi-dependencies]
# 本地包（editable 安装）
ditto-core = { path = "packages/core", editable = true }
ditto-foundation = { path = "packages/foundation", editable = true }
ditto-datahub = { path = "packages/datahub", editable = true }
ditto-port = { path = "apps/port", editable = true }

# 性能优化库
cachebox = ">=5.0,<6"
granian = ">=1.0,<2"
orjson = ">=3.10,<4"

# 数据源
akshare = ">=1.15,<2"

# 文件锁
filelock = ">=3.16,<4"

# OpenTelemetry
opentelemetry-api = ">=1.28,<2"
opentelemetry-sdk = ">=1.28,<2"
opentelemetry-exporter-otlp-proto-http = ">=1.28,<2"

# 其他
uuid7 = ">=0.1,<1"
tenacity = ">=8.0,<9"
limits = ">=3.15"
keyring = ">=25.0,<26"
typer = ">=0.12,<1"

# ==========================================================
# 开发环境 Feature
# ==========================================================
[feature.dev.dependencies]
# 代码质量工具
ruff = ">=0.8,<1"
pre-commit = ">=4.0,<5"

# 测试框架
pytest = ">=8.0,<9"
pytest-cov = ">=6.0,<7"
pytest-asyncio = ">=0.24,<1"
pytest-mock = ">=3.14,<4"
pytest-benchmark = ">=4.0,<5"
pytest-xdist = ">=3.5,<4"
pytest-timeout = ">=2.3,<3"
requests-mock = ">=1.12,<2"
inline-snapshot = ">=0.10"
hypothesis = ">=6.100"
respx = ">=0.21"

# 测试辅助
faker = ">=33,<40"
pandera = ">=0.21,<1"

# 类型存根
types-requests = ">=2.32,<3"
types-pyyaml = ">=6.0,<7"
types-python-dateutil = ">=2.9,<3"

# 开发工具
ipykernel = ">=6.29,<7"
jupyter = ">=1.1,<2"

[feature.dev.pypi-dependencies]
# Pyright 类型检查（替代 mypy）
pyright = ">=1.1.390,<2"

# ==========================================================
# 环境定义
# ==========================================================
[environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

# ==========================================================
# 任务定义
# ==========================================================
[tasks]
# ──────────────────────────────────────────────────────────
# 代码质量
# ──────────────────────────────────────────────────────────
lint = "ruff check ."
lint-fix = "ruff check --fix --exit-non-zero-on-fix --show-fixes ."
# 给 pre-commit 用：不带 "."，让 pre-commit 传入的文件列表生效
lint-staged = "ruff check"
lint-fix-staged = "ruff check --fix --exit-non-zero-on-fix --show-fixes"

format-check = "ruff format --check --diff ."
format-check-staged = "ruff format --check --diff"

format = "ruff format ."
format-staged = "ruff format"

# 类型检查 - 源码（standard + strict 核心目录）
typecheck = "pyright --warnings"

# 类型检查 - 测试（basic 模式，宽松）
typecheck-tests = "pyright --project pyright.tests.json"

# 类型检查 - 全部（CI 用）
typecheck-all = { depends-on = ["typecheck", "typecheck-tests"] }

# ──────────────────────────────────────────────────────────
# 测试（分层并行策略）
# ──────────────────────────────────────────────────────────
# 基础测试命令
test = "pytest"
test-pit = "pytest -m pit -v --tb=long"
test-benchmark = "pytest -m benchmark --benchmark-only"

# 分层测试命令（并行优化）
# DataHub 单元测试：并行（已验证安全）
test-unit-datahub = "pytest packages/datahub/tests/unit/ -n auto -v"

# Port 单元测试：有限并行（需验证）
test-unit-port = "pytest apps/port/tests/unit/ -n 2 -v"

# 集成测试：串行（有 session fixtures）
test-integration = "pytest -m integration -n 0 -v"

# 快速测试：串行（开发时）
test-fast = "pytest -m 'not slow and not integration and not e2e and not external' --no-cov -q --tb=no -x"

# 兼容原有命令（串行）
test-unit = "pytest -m 'not slow and not integration and not e2e and not external' --no-cov -q"

# 覆盖率测试
test-cov = "pytest --cov --cov-report=html --cov-report=term-missing"
test-cov-xml = "pytest --cov --cov-report=xml --cov-report=term-missing --cov-fail-under=80"

# 完整测试：分层执行
test-all = "pytest packages/datahub/tests/unit/ -n auto && pytest apps/port/tests/unit/ -n 2 && pytest -m integration -n 0"

# ──────────────────────────────────────────────────────────
# Pre-commit
# ──────────────────────────────────────────────────────────
pre-commit-install = "pre-commit install --hook-type commit-msg --hook-type pre-commit --hook-type pre-push"
pre-commit-run = "pre-commit run --all-files"
pre-commit-update = "pre-commit autoupdate"

# ──────────────────────────────────────────────────────────
# 复合任务
# ──────────────────────────────────────────────────────────
# CI 完整检查
ci-check = { depends-on = [
    "lint",
    "format-check",
    "typecheck-all",
    "security",
    "test-cov-xml",
] }

# 快速检查（开发时用）
quick-check = { depends-on = ["lint-fix", "format", "test-fast"] }

# ──────────────────────────────────────────────────────────
# 服务
# ──────────────────────────────────────────────────────────
server = "granian apps.port.src.ditto_port.main:app --interface asgi --reload --host 0.0.0.0 --port 8000"
server-prod = "granian apps.port.src.ditto_port.main:app --interface asgi --host 0.0.0.0 --port 8000 --workers 4"
ditto = "python -m ditto_port.cli.main"

# ──────────────────────────────────────────────────────────
# 清理
# ──────────────────────────────────────────────────────────
clean = """
rm -rf dist/ build/ *.egg-info \
    .pytest_cache .ruff_cache \
    htmlcov .coverage coverage.xml \
    **/__pycache__
"""
