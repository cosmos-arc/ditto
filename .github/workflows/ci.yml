name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PIXI_VERSION: v0.73.0

jobs:
  repository-policy:
    name: Repository policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Diff hygiene
        env:
          CHECK_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          base="$CHECK_BASE_SHA"
          zero_sha="0000000000000000000000000000000000000000"
          if test -n "$base" && test "$base" != "$zero_sha" && git cat-file -e "$base^{commit}"; then
            git diff --check "$base" "$GITHUB_SHA"
          else
            git show --check --format= "$GITHUB_SHA"
          fi
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          cache: true
          frozen: true
          environments: dev
      - name: Validate delivery policy
        run: pixi run -e dev python -m pytest tooling/release/tests/test_repository_policy.py -q -n 0

  backend-quality:
    name: Backend format and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          cache: true
          frozen: true
          environments: dev
      - name: Package contracts
        run: pixi run -e dev package-contract-check
      - name: Formatting
        run: pixi run -e dev fmt-check
      - name: Lint
        run: pixi run -e dev lint

  backend-types:
    name: Backend types
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          cache: true
          frozen: true
          environments: dev
      - name: Strict type check
        run: pixi run -e dev type --all --clean

  backend-tests:
    name: Backend tests and coverage
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          cache: true
          frozen: true
          environments: dev
      - name: Test with coverage policy
        env:
          COVERAGE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: pixi run -e dev backend-coverage
      - name: Publish backend coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          disable_search: true
          fail_ci_if_error: true
          files: coverage.xml
          flags: backend,backend-critical
          use_oidc: true
      - name: PIT correctness suite
        run: pixi run -e dev pit
      - name: Upload coverage evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-coverage-${{ github.run_id }}
          path: |
            coverage.json
            coverage.xml
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 30 }}

  architecture-harness:
    name: Architecture and agent harness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          cache: true
          frozen: true
          environments: dev
      - name: Architecture boundaries
        run: pixi run -e dev arch-check
      - name: Agent harness
        run: pixi run -e dev harness-check

  web-quality:
    name: Web lint, types, tests and build
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          cache: true
          frozen: true
          environments: dev
      - name: Frozen Web install
        run: bun install --frozen-lockfile
      - name: Web CI
        run: pixi run -e dev web-ci
      - name: Publish Web coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          disable_search: true
          fail_ci_if_error: true
          files: apps/web/coverage/coverage-final.json
          flags: web
          use_oidc: true
      - name: Upload Web build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-dist-${{ github.run_id }}
          path: apps/web/dist
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 30 }}

  api-contract:
    name: OpenAPI compatibility and generated types
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          cache: true
          frozen: true
          environments: dev
      - uses: ./.github/actions/setup-bun
      - name: Frozen Web install
        run: bun install --frozen-lockfile
      - name: Fetch pinned oasdiff distribution
        env:
          OASDIFF_VERSION: 1.28.0
        run: |
          mkdir -p "$RUNNER_TEMP/oasdiff"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/checksums.txt" \
            --output "$RUNNER_TEMP/oasdiff/checksums.txt"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz" \
            --output "$RUNNER_TEMP/oasdiff/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
      - name: Contract gate
        env:
          DITTO_OASDIFF_DIST_DIR: ${{ runner.temp }}/oasdiff
        run: pixi run -e dev check-contract

  system-e2e:
    name: Supervised backend-Web system test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          cache: true
          frozen: true
          environments: dev
      - uses: ./.github/actions/setup-bun
      - name: Frozen Web install
        run: bun install --frozen-lockfile
      - name: Run supervised system test
        run: pixi run -e dev test-system
      - name: Upload system browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: system-e2e-${{ github.run_id }}
          path: build/system-e2e
          if-no-files-found: warn
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 30 }}

  release-cohort:
    name: Release cohort policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          cache: true
          frozen: true
          environments: dev
      - name: Test release and security policy
        run: pixi run -e dev python -m pytest tooling/release/tests tooling/security/tests -q -n 0

  container-smoke:
    name: Container build and readiness smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build immutable runtime image
        env:
          IMAGE: ditto-ci:${{ github.sha }}
        run: |
          product_version="$(python3 -c 'import json; print(json.load(open("package.json", encoding="utf-8"))["version"])')"
          contract_sha256="$(sha256sum contracts/openapi/v1.json | cut -d ' ' -f 1)"
          environment_lock_sha256="$(sha256sum pixi.lock | cut -d ' ' -f 1)"
          docker build \
            --pull \
            --file deploy/docker/Dockerfile \
            --tag "$IMAGE" \
            --build-arg "DITTO_PRODUCT_VERSION=$product_version" \
            --build-arg "DITTO_GIT_SHA=${{ github.sha }}" \
            --build-arg "DITTO_RESEARCH_ENVIRONMENT_LOCK_HASH=$environment_lock_sha256" \
            --build-arg "DITTO_API_CONTRACT_VERSION=v1" \
            --build-arg "DITTO_API_CONTRACT_SHA256=$contract_sha256" \
            .
      - name: Verify non-root runtime and readiness
        env:
          IMAGE: ditto-ci:${{ github.sha }}
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' "$IMAGE")" = "65532:65532"
          container_id="$(docker run --detach --rm --env TUSHARE_TOKEN=ci-smoke-offline-credential --publish 127.0.0.1:18000:8000 "$IMAGE")"
          trap 'docker logs "$container_id"; docker stop "$container_id"' EXIT
          for attempt in $(seq 1 60); do
            echo "readiness attempt $attempt/60"
            if curl --fail --silent --show-error http://127.0.0.1:18000/readyz; then
              exit 0
            fi
            sleep 1
          done
          exit 1

  platform-smoke:
    name: Platform smoke (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-14
          - name: windows-x64
            os: windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          cache: true
          frozen: true
          environments: dev
      - uses: ./.github/actions/setup-bun
      - name: Bootstrap the supported toolchain
        run: pixi run -e dev bootstrap
      - name: macOS backend gate
        if: ${{ matrix.name == 'macos-arm64' }}
        run: pixi run -e dev check-backend
      - name: macOS Web gate
        if: ${{ matrix.name == 'macos-arm64' }}
        run: pixi run -e dev check-web
      - name: Windows backend type gate
        if: ${{ matrix.name == 'windows-x64' }}
        run: pixi run -e dev type-all
      - name: Windows Web type gate
        if: ${{ matrix.name == 'windows-x64' }}
        run: pixi run -e dev web-type
      - name: Windows backend core unit
        if: ${{ matrix.name == 'windows-x64' }}
        run: pixi run -e dev platform-backend-unit
      - name: Windows Web unit
        if: ${{ matrix.name == 'windows-x64' }}
        run: pixi run -e dev platform-web-unit
      - name: Windows loopback API smoke
        if: ${{ matrix.name == 'windows-x64' }}
        run: pixi run -e dev platform-api-smoke

  security-supply-chain:
    name: Security and supply chain
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/security.yml

  ci-gate:
    name: CI gate
    if: ${{ always() }}
    needs:
      - repository-policy
      - backend-quality
      - backend-types
      - backend-tests
      - architecture-harness
      - web-quality
      - api-contract
      - system-e2e
      - release-cohort
      - container-smoke
      - platform-smoke
      - security-supply-chain
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Require every semantic job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os

          needs = json.loads(os.environ["NEEDS_JSON"])
          failures = {
              name: value["result"]
              for name, value in needs.items()
              if value["result"] != "success"
          }
          if len(needs) != 12 or failures:
              raise SystemExit(f"CI fail-closed: expected 12 successes, failures={failures}")
          PY
