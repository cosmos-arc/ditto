# .github/workflows/ci.yml
# Ditto CI Pipeline - 基于实际项目结构设计
#
# 特点：
# - 使用 Pixi 包管理器
# - Monorepo 与 Agent Harness 变更检测
# - 分层测试策略（unit → integration）
# - 前端工作流预留

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  # ============================================================
  # Stage 1: 变更检测
  # ============================================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python:
              - 'packages/**/*.py'
              - 'scripts/**/*.py'
              - 'pyproject.toml'
              - 'pixi.toml'
              - 'pixi.lock'
              - '.importlinter'
              - 'AGENTS.md'
              - 'CLAUDE.md'
              - 'packages/*/AGENTS.md'
              - 'packages/*/CLAUDE.md'
              - '.agents/**'
              - '.claude/**'
              - '.codex/**'
              - 'scripts/agent_harness/**'
              - 'docs/engineering/agent-harness.md'
              - 'docs/engineering/testing.md'
              - '.pre-commit-config.yaml'
            infra:
              - '.github/**'
              - 'deploy/**'
              - 'Dockerfile*'
              - 'docker-compose*.yml'

  # ============================================================
  # Stage 2: 架构审计门禁（新增）
  # ============================================================
  audit:
    name: Architecture Audit
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.9.3
        with:
          pixi-version: v0.39.5
          cache: true
          locked: true
          environments: dev

      - name: Architecture check
        run: pixi run -e dev arch-check

      - name: Type check
        run: pixi run -e dev type --all

      - name: Fast tests
        run: pixi run -e dev test --fast

      - name: Agent harness check
        run: pixi run -e dev harness-check

  # ============================================================
  # Stage 3: Python 代码质量检查（并行）
  # ============================================================
  lint:
    name: lint
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.9.3
        with:
          pixi-version: v0.39.5
          cache: true
          locked: true
          environments: dev # 使用 dev 环境，包含代码质量工具

      - name: Ruff lint
        run: pixi run -e dev ruff check --output-format=github .

      - name: Ruff format check
        run: pixi run -e dev ruff format --check --diff .

  type-check:
    name: type-check
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.9.3
        with:
          pixi-version: v0.39.5
          cache: true
          locked: true
          environments: dev # 使用 dev 环境，包含代码质量工具

      - name: Pyright type check
        run: pixi run -e dev type --all

  # ============================================================
  # Stage 3: 测试套件（分层执行）
  # ============================================================
  test-unit:
    name: test-unit
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.9.3
        with:
          pixi-version: v0.39.5
          cache: true
          locked: true
          environments: dev # 使用 dev 环境，包含代码质量工具

      - name: Run unit tests
        run: |
          # 全包单元测试：并行
          pixi run -e dev pytest packages/*/tests/unit/ \
            -n auto \
            --cov=packages \
            --cov-report=xml:coverage-unit.xml \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            --junitxml=junit-unit.xml \
            -v \
            --durations=10

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage-unit.xml
          flags: unit
          fail_ci_if_error: false
          # 对于公开仓库，不需要 token
          # token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-unit
          path: junit-unit.xml

  # ============================================================
  # Stage 3b: Golden E2E 回归（合成数据全链路，进 PR 门禁）
  # ============================================================
  golden-e2e:
    name: golden-e2e
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.9.3
        with:
          pixi-version: v0.39.5
          cache: true
          locked: true
          environments: dev

      - name: Golden E2E
        run: pixi run -e dev pytest packages/apps/tests/integration/test_golden_e2e.py packages/apps/tests/integration/test_stock_selection_golden_e2e.py -v

  # ============================================================
  # Stage 3c: macOS Apple Silicon compatibility gate
  # ============================================================
  macos-arm64:
    name: macos-arm64
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' || github.event_name == 'push' }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Assert Apple Silicon runner
        run: test "$(uname -m)" = "arm64"

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.9.3
        with:
          pixi-version: v0.39.5
          cache: true
          locked: true
          environments: dev

      - name: Architecture and static checks
        run: |
          pixi run -e dev arch-check
          pixi run -e dev fmt-check
          pixi run -e dev lint
          pixi run -e dev type --tests

      - name: R4 target tests
        run: |
          pixi run -e dev pytest --no-cov \
            packages/features/tests/unit/risk_estimation/test_covariance_estimator_unit.py \
            packages/features/tests/unit/risk_estimation/test_factor_risk_estimator_unit.py \
            packages/portfolio/tests/unit/rebalancing/test_cvxpy_optimizer_unit.py \
            packages/portfolio/tests/unit/rebalancing/test_r4_benchmark_harness_unit.py \
            packages/risk/tests/unit/test_risk_contracts_unit.py \
            packages/risk/tests/unit/test_continuous_risk_gate_unit.py \
            packages/risk/tests/unit/test_r4_tail_risk_unit.py \
            packages/application/tests/unit/process/portfolio/ \
            packages/application/tests/unit/process/risk/ \
            packages/application/tests/unit/process/execution/test_paper_trading_process_unit.py \
            packages/application/tests/unit/process/strategy/test_backtest_service_unit.py::TestBacktestServiceOptions::test_r4_ports_are_forwarded_to_engine_options \
            packages/application/tests/unit/query/test_daily_decision_v3_unit.py \
            packages/apps/tests/unit/registry/test_r4_risk_persistence_unit.py \
            packages/apps/tests/integration/api/test_trade_api_integration.py::TestDailyDecision::test_v3_returns_typed_risk_and_reconciliation_sections \
            packages/backtest/tests/unit/test_continuous_risk_runtime_steps.py \
            packages/backtest/tests/unit/test_portfolio_construction_step.py \
            packages/backtest/tests/unit/test_engine_result_unit.py::TestBacktestCheckpoint::test_r4_runtime_state_attests_optimizer_and_risk_evidence_v3 \
            packages/backtest/tests/unit/test_engine_result_unit.py::TestBacktestCheckpoint::test_v3_runtime_state_rejects_missing_risk_state \
            packages/backtest/tests/integration/test_risk_integration.py \
            -q

      - name: CVXPY solver smoke test
        run: |
          pixi run -e dev python -c 'import cvxpy as cp; installed = set(cp.installed_solvers()); assert {"OSQP", "CLARABEL"} <= installed, installed'

  # ============================================================
  # Stage 4: 构建验证（仅 main 分支）
  # ============================================================
  build:
    name: Build Validation
    needs: [lint, type-check, test-unit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.9.3
        with:
          pixi-version: v0.39.5
          cache: true
          locked: true
          environments: dev # 使用 dev 环境，包含代码质量工具

      # 验证各包可以正常构建
      - name: Build packages
        run: |
          cd packages/infra && pixi run python -m build --wheel --outdir ../../dist/
          cd ../kernel && pixi run python -m build --wheel --outdir ../../dist/
          cd ../data && pixi run python -m build --wheel --outdir ../../dist/
          cd ../analytics && pixi run python -m build --wheel --outdir ../../dist/
          cd ../engine && pixi run python -m build --wheel --outdir ../../dist/
          cd ../app && pixi run python -m build --wheel --outdir ../../dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ============================================================
  # 最终状态汇总（用于 Branch Protection）
  # ============================================================
  ci-success:
    name: ci-success
    needs: [audit, lint, type-check, test-unit, golden-e2e, macos-arm64]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs
        run: |
          results=("${{ needs.audit.result }}" "${{ needs.lint.result }}" "${{ needs.type-check.result }}" "${{ needs.test-unit.result }}" "${{ needs.golden-e2e.result }}" "${{ needs.macos-arm64.result }}")
          for result in "${results[@]}"; do
            case "$result" in
              success|skipped) ;;
              *)
                echo "::error::One or more required CI checks did not succeed"
                exit 1
                ;;
            esac
          done
          echo "All required CI checks passed!"
