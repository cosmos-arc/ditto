name: CI
'on':
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  merge_group: null
  schedule:
    - cron: 11 1 * * 1
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  repository-policy:
    name: Repository policy
    outputs:
      required: ${{ steps.scope.outputs.required }}
      analysis: ${{ steps.scope.outputs.analysis }}
      full: ${{ steps.scope.outputs.full }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select checks from changed scope
        id: scope
        env:
          CHECK_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 -m tooling.agent_harness.ci select
      - name: Validate active knowledge and machine input locations
        run: python3 -m tooling.quality.knowledge
      - name: Diff hygiene
        env:
          CHECK_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          base="$CHECK_BASE_SHA"
          zero_sha="0000000000000000000000000000000000000000"
          if test -n "$base" && test "$base" != "$zero_sha" && git cat-file -e "$base^{commit}"; then
            git diff --check "$base" "$GITHUB_SHA"
          else
            git show --check --format= "$GITHUB_SHA"
          fi
  skill-validation:
    needs: repository-policy
    if: ${{ contains(fromJSON(needs.repository-policy.outputs.required || '[]'), 'skill-validation') }}
    name: Skill structure and mirrors
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          workspace: python
      - name: Validate project skills and host adapters
        run: task harness-validate
  backend-quality:
    needs: repository-policy
    if: ${{ contains(fromJSON(needs.repository-policy.outputs.required || '[]'), 'backend-quality') }}
    name: Backend format and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          workspace: python
      - name: Package contracts
        run: task package-contract-check
      - name: Formatting
        run: task fmt-check
      - name: Lint
        run: task lint
  backend-types:
    needs: repository-policy
    if: ${{ contains(fromJSON(needs.repository-policy.outputs.required || '[]'), 'backend-types') }}
    name: Backend types
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          workspace: python
      - name: Strict type check
        run: task type -- --all --clean
  backend-tests:
    needs:
      - repository-policy
      - backend-shards
    if: ${{ contains(fromJSON(needs.repository-policy.outputs.required || '[]'), 'backend-tests') }}
    name: Backend tests and coverage
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          workspace: python
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: backend-shard-*-${{ github.run_id }}
          path: build/test-shards
          merge-multiple: true
      - name: Verify shard completeness and coverage policy
        env:
          COVERAGE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |-
          task backend-coverage-combine -- --count 4 --commit "$GITHUB_SHA"
          uv run --no-sync python tooling/quality/coverage_gate.py --report coverage.json
      - name: PIT correctness suite
        run: task pit
      - name: Upload coverage evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-coverage-${{ github.run_id }}
          path: |
            coverage.json
            coverage.xml
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 30 }}
      - name: Publish backend coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          disable_search: true
          fail_ci_if_error: true
          files: coverage.xml
          flags: backend,backend-critical
          use_oidc: true
  architecture-harness:
    needs: repository-policy
    if: ${{ contains(fromJSON(needs.repository-policy.outputs.required || '[]'), 'architecture-harness') }}
    name: Architecture and agent harness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-toolchain
      - name: Architecture boundaries
        run: task arch-check
      - name: Agent harness
        run: task harness-check
  web-quality:
    needs: repository-policy
    if: ${{ contains(fromJSON(needs.repository-policy.outputs.required || '[]'), 'web-quality') }}
    name: Web static checks and coverage
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          workspace: web
      - name: Web CI
        run: task web-quality
      - name: Publish Web coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          disable_search: true
          fail_ci_if_error: true
          files: apps/web/coverage/coverage-final.json
          flags: web
          use_oidc: true
  api-contract:
    needs: repository-policy
    if: ${{ contains(fromJSON(needs.repository-policy.outputs.required || '[]'), 'api-contract') }}
    name: OpenAPI compatibility and generated types
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - name: Prepare contract toolchain
        run: task contract-toolchain-bootstrap
      - name: Contract gate
        run: task check-contract
  system-e2e:
    needs:
      - repository-policy
      - web-build
    if: ${{ contains(fromJSON(needs.repository-policy.outputs.required || '[]'), 'system-e2e') }}
    name: Supervised backend-Web system test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: web-dist-${{ github.run_id }}
          path: apps/web/dist
      - name: Prepare system browser
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Run supervised system test
        run: task test-system
        env:
          DITTO_REUSE_WEB_BUILD: '1'
      - name: Upload system browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: system-e2e-${{ github.run_id }}
          path: build/system-e2e
          if-no-files-found: warn
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 30 }}
  release-cohort:
    needs: repository-policy
    if: ${{ contains(fromJSON(needs.repository-policy.outputs.required || '[]'), 'release-cohort') }}
    name: Release cohort policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          workspace: python
      - name: Test release and security policy
        run: uv run --no-sync python -m pytest tooling/release/tests tooling/security/tests -q -n 0
  container-smoke:
    needs:
      - repository-policy
      - web-build
    if: ${{ contains(fromJSON(needs.repository-policy.outputs.required || '[]'), 'container-smoke') }}
    name: Container build and readiness smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          workspace: python
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: web-dist-${{ github.run_id }}
          path: apps/web/dist
      - name: Build once, scan, attest subject and smoke
        run: uv run --no-sync python -m tooling.release.artifact_gate
      - name: Upload artifact evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cohort-${{ github.run_id }}
          path: dist
          if-no-files-found: error
          retention-days: 14
  platform-smoke:
    needs: repository-policy
    if: ${{ contains(fromJSON(needs.repository-policy.outputs.required || '[]'), 'platform-smoke') }}
    name: Platform smoke (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-14
          - name: windows-x64
            os: windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - name: Native wheel behavior
        run: task platform-native-test
      - name: macOS backend gate
        if: ${{ matrix.name == 'macos-arm64' && needs.repository-policy.outputs.full == 'true' }}
        run: task check-backend
      - name: macOS Web gate
        if: ${{ matrix.name == 'macos-arm64' && needs.repository-policy.outputs.full == 'true' }}
        run: task check-web
      - name: Windows backend type gate
        if: ${{ matrix.name == 'windows-x64' && needs.repository-policy.outputs.full == 'true' }}
        run: task type-all
      - name: Windows Web type gate
        if: ${{ matrix.name == 'windows-x64' && needs.repository-policy.outputs.full == 'true' }}
        run: task web-type
      - name: Windows backend core unit
        if: ${{ matrix.name == 'windows-x64' }}
        run: task platform-backend-unit
      - name: Windows Web unit
        if: ${{ matrix.name == 'windows-x64' }}
        run: task platform-web-unit
      - name: Windows loopback API smoke
        if: ${{ matrix.name == 'windows-x64' }}
        run: task platform-api-smoke
      - name: macOS backend core unit
        if: ${{ matrix.name == 'macos-arm64' && needs.repository-policy.outputs.full != 'true' }}
        run: task platform-backend-unit
      - name: macOS loopback API smoke
        if: ${{ matrix.name == 'macos-arm64' && needs.repository-policy.outputs.full != 'true' }}
        run: task platform-api-smoke
  security-supply-chain:
    needs: repository-policy
    if: ${{ contains(fromJSON(needs.repository-policy.outputs.required || '[]'), 'security-supply-chain') }}
    name: Security and supply chain
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/security.yml
    with:
      full-analysis: ${{ needs.repository-policy.outputs.analysis == 'true' }}
  ci-gate:
    name: CI gate
    if: ${{ always() }}
    needs:
      - repository-policy
      - backend-quality
      - backend-types
      - backend-tests
      - architecture-harness
      - skill-validation
      - web-quality
      - api-contract
      - system-e2e
      - release-cohort
      - container-smoke
      - platform-smoke
      - security-supply-chain
      - delivery-policy
      - backend-shards
      - web-prototype
      - web-build
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected job to succeed
        env:
          REQUIRED_JOBS: ${{ needs.repository-policy.outputs.required }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os

          required = json.loads(os.environ["REQUIRED_JOBS"])
          needs = json.loads(os.environ["NEEDS_JSON"])
          if not isinstance(required, list) or not {"repository-policy", "security-supply-chain"} <= set(required):
              raise SystemExit("CI fail-closed: invalid selection")
          failures = {
              name: needs.get(name, {}).get("result", "missing")
              for name in set(required) | set(needs)
              if needs.get(name, {}).get("result") != "success"
              and not (name not in required and needs.get(name, {}).get("result") == "skipped")
          }
          if failures:
              raise SystemExit(f"CI fail-closed: {failures}")
          PYTHON
  delivery-policy:
    needs: repository-policy
    if: ${{ contains(fromJSON(needs.repository-policy.outputs.required || '[]'), 'delivery-policy') }}
    name: delivery-policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          workspace: python
      - name: Validate delivery policy
        run: uv run --no-sync python -m pytest tooling/release/tests/test_repository_policy.py -q -n 0
  backend-shards:
    needs: repository-policy
    if: ${{ contains(fromJSON(needs.repository-policy.outputs.required || '[]'), 'backend-shards') }}
    name: backend-shards
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          workspace: python
      - name: Run isolated shard
        run: task backend-test-shard -- --index ${{ matrix.index }} --count 4 --commit "$GITHUB_SHA"
      - name: Preserve shard coverage and inventory
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-shard-${{ matrix.index }}-${{ github.run_id }}
          path: build/test-shards
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 30 }}
          include-hidden-files: true
    strategy:
      fail-fast: false
      matrix:
        index:
          - 0
          - 1
          - 2
          - 3
      max-parallel: 4
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      POLARS_MAX_THREADS: '2'
      PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
  web-prototype:
    needs: repository-policy
    if: ${{ contains(fromJSON(needs.repository-policy.outputs.required || '[]'), 'web-prototype') }}
    name: web-prototype
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          workspace: web
      - name: Prepare browser
        run: task browser-install -- --with-deps
      - name: Prototype coverage of product flows
        run: task web-prototype
  web-build:
    needs: repository-policy
    if: ${{ contains(fromJSON(needs.repository-policy.outputs.required || '[]'), 'web-build') }}
    name: web-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          workspace: web
      - name: Build production Web
        run: task web-build
      - name: Upload Web build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-dist-${{ github.run_id }}
          path: apps/web/dist
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 30 }}
