# .github/workflows/ci.yml
# Ditto CI Pipeline - 基于实际项目结构设计
#
# 特点：
# - 使用 Pixi 包管理器
# - Monorepo 变更检测（packages/* + interfaces/*）
# - 分层测试策略（unit → integration）
# - 前端工作流预留

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  # ============================================================
  # Stage 1: 变更检测
  # ============================================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python:
              - 'packages/**/*.py'
              - 'interfaces/**/*.py'
              - 'scripts/**/*.py'
              - 'pyproject.toml'
              - 'pixi.toml'
              - 'pixi.lock'
            infra:
              - '.github/**'
              - 'deploy/**'
              - 'Dockerfile*'
              - 'docker-compose*.yml'

  # ============================================================
  # Stage 2: 架构审计门禁（新增）
  # ============================================================
  audit:
    name: Architecture Audit
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.9.3
        with:
          pixi-version: v0.39.5
          cache: true
          locked: true
          environments: dev

      - name: Architecture check
        run: pixi run -e dev arch-check

      - name: Type check
        run: pixi run -e dev type --all

      - name: Fast tests
        run: pixi run -e dev test --fast

  # ============================================================
  # Stage 3: Python 代码质量检查（并行）
  # ============================================================
  lint:
    name: lint
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.9.3
        with:
          pixi-version: v0.39.5
          cache: true
          locked: true
          environments: dev # 使用 dev 环境，包含代码质量工具

      - name: Ruff lint
        run: pixi run -e dev ruff check --output-format=github .

      - name: Ruff format check
        run: pixi run -e dev ruff format --check --diff .

  type-check:
    name: type-check
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.9.3
        with:
          pixi-version: v0.39.5
          cache: true
          locked: true
          environments: dev # 使用 dev 环境，包含代码质量工具

      - name: Pyright type check
        run: pixi run -e dev type --all

  # ============================================================
  # Stage 3: 测试套件（分层执行）
  # ============================================================
  test-unit:
    name: test-unit
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.9.3
        with:
          pixi-version: v0.39.5
          cache: true
          locked: true
          environments: dev # 使用 dev 环境，包含代码质量工具

      - name: Run unit tests
        run: |
          # 全包单元测试：并行
          pixi run -e dev pytest packages/*/tests/unit/ \
            -n auto \
            --cov=packages \
            --cov-report=xml:coverage-unit.xml \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            --junitxml=junit-unit.xml \
            -v \
            --durations=10

          # Interfaces 单元测试：有限并行
          pixi run -e dev pytest interfaces/tests/unit/ \
            -m "not integration and not slow" \
            -n 2 \
            --cov=packages --cov=interfaces \
            --cov-report=xml:coverage-unit.xml \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            --junitxml=junit-unit.xml \
            -v \
            --durations=10

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage-unit.xml
          flags: unit
          fail_ci_if_error: false
          # 对于公开仓库，不需要 token
          # token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-unit
          path: junit-unit.xml

  # ============================================================
  # Stage 4: 构建验证（仅 main 分支）
  # ============================================================
  build:
    name: Build Validation
    needs: [lint, type-check, test-unit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.9.3
        with:
          pixi-version: v0.39.5
          cache: true
          locked: true
          environments: dev # 使用 dev 环境，包含代码质量工具

      # 验证各包可以正常构建
      - name: Build packages
        run: |
          cd packages/infra && pixi run python -m build --wheel --outdir ../../dist/
          cd ../kernel && pixi run python -m build --wheel --outdir ../../dist/
          cd ../data && pixi run python -m build --wheel --outdir ../../dist/
          cd ../analytics && pixi run python -m build --wheel --outdir ../../dist/
          cd ../engine && pixi run python -m build --wheel --outdir ../../dist/
          cd ../app && pixi run python -m build --wheel --outdir ../../dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ============================================================
  # 最终状态汇总（用于 Branch Protection）
  # ============================================================
  ci-success:
    name: ci-success
    needs: [audit, lint, type-check, test-unit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs
        run: |
          results=("${{ needs.audit.result }}" "${{ needs.lint.result }}" "${{ needs.type-check.result }}" "${{ needs.test-unit.result }}")
          for result in "${results[@]}"; do
            if [[ "$result" == "failure" ]]; then
              echo "::error::One or more required CI checks failed"
              exit 1
            fi
          done
          echo "All required CI checks passed!"
