# .github/workflows/ci.yml
# Ditto CI Pipeline - 基于实际项目结构设计
#
# 特点：
# - 使用 Pixi 包管理器
# - Monorepo 变更检测（packages/* + apps/*）
# - 分层测试策略（unit → integration → e2e）
# - 前端工作流预留

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ============================================================
  # Stage 1: 变更检测
  # ============================================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python:
              - 'packages/**/*.py'
              - 'apps/server/**/*.py'
              - 'tests/**/*.py'
              - 'scripts/**/*.py'
              - 'pyproject.toml'
              - 'pixi.toml'
              - 'pixi.lock'
            frontend:
              - 'apps/web/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
            infra:
              - '.github/**'
              - 'deploy/**'
              - 'Dockerfile*'
              - 'docker-compose*.yml'

  # ============================================================
  # Stage 2: Python 代码质量检查（并行）
  # ============================================================
  lint:
    name: lint
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.9.3
        with:
          pixi-version: v0.39.5
          cache: true
          locked: true
          environments: dev # 使用 dev 环境，包含代码质量工具

      - name: Ruff lint
        run: pixi run -e dev ruff check --output-format=github .

      - name: Ruff format check
        run: pixi run -e dev ruff format --check --diff .

  type-check:
    name: type-check
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.9.3
        with:
          pixi-version: v0.39.5
          cache: true
          locked: true
          environments: dev # 使用 dev 环境，包含代码质量工具

      # Mypy 缓存
      - name: Cache mypy
        uses: actions/cache@v4
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('pyproject.toml', 'pixi.lock') }}
          restore-keys: |
            mypy-${{ runner.os }}-${{ env.PYTHON_VERSION }}-

      - name: Mypy type check
        run: |
          pixi run -e dev mypy packages/ apps/server/ \
            --no-error-summary \
            --show-error-codes

  security:
    name: security
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.9.3
        with:
          pixi-version: v0.39.5
          cache: true
          locked: true
          environments: dev # 使用 dev 环境，包含代码质量工具

      # Bandit 安全扫描
      - name: Bandit security lint
        run: |
          pixi run -e dev bandit -r packages/ apps/server/src/ \
            -c pyproject.toml \
            -f json \
            -o bandit-report.json \
            --severity-level medium \
            || true

      - name: Check Bandit results
        run: |
          if [ -f bandit-report.json ]; then
            HIGH_ISSUES=$(python -c "import json; r=json.load(open('bandit-report.json')); print(sum(1 for i in r.get('results',[]) if i['issue_severity']=='HIGH'))")
            if [ "$HIGH_ISSUES" -gt 0 ]; then
              echo "::error::Found $HIGH_ISSUES high severity security issues"
              cat bandit-report.json | python -m json.tool
              exit 1
            fi
          fi

      - name: Upload security report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report
          path: bandit-report.json
          retention-days: 7

      # Gitleaks 敏感信息检测
      - name: Gitleaks scan
        run: |
          wget -q https://github.com/gitleaks/gitleaks/releases/latest/download/gitleaks-linux-amd64.tar.gz
          tar -xzf gitleaks-linux-amd64.tar.gz
          ./gitleaks detect --source . --verbose --report-path gitleaks-report.json

  # ============================================================
  # Stage 3: 测试套件（分层执行）
  # ============================================================
  test-unit:
    name: test-unit
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.9.3
        with:
          pixi-version: v0.39.5
          cache: true
          locked: true
          environments: dev # 使用 dev 环境，包含代码质量工具

      - name: Run unit tests
        run: |
          pixi run -e dev pytest \
            -m "not integration and not e2e and not slow" \
            --cov=packages \
            --cov=apps \
            --cov-report=xml:coverage-unit.xml \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            --junitxml=junit-unit.xml \
            -v \
            --durations=10

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage-unit.xml
          flags: unit
          fail_ci_if_error: false
          # 对于公开仓库，不需要 token
          # token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-unit
          path: junit-unit.xml

  # ============================================================
  # Stage 4: 构建验证（仅 main 分支）
  # ============================================================
  build:
    name: Build Validation
    needs: [lint, type-check, security, test-unit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.9.3
        with:
          pixi-version: v0.39.5
          cache: true
          locked: true
          environments: dev # 使用 dev 环境，包含代码质量工具

      # 验证各包可以正常构建
      - name: Build packages
        run: |
          cd packages/foundation && pixi run python -m build --wheel --outdir ../../dist/
          cd ../core && pixi run python -m build --wheel --outdir ../../dist/
          cd ../datahub && pixi run python -m build --wheel --outdir ../../dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ============================================================
  # 预留：前端检查
  # ============================================================
  frontend-check:
    name: Frontend Checks
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: "apps/web/pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

  # ============================================================
  # 最终状态汇总（用于 Branch Protection）
  # ============================================================
  ci-success:
    name: ci-success
    needs: [lint, type-check, security, test-unit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs
        run: |
          results=("${{ needs.lint.result }}" "${{ needs.type-check.result }}" "${{ needs.security.result }}" "${{ needs.test-unit.result }}")
          for result in "${results[@]}"; do
            if [[ "$result" == "failure" ]]; then
              echo "::error::One or more required CI checks failed"
              exit 1
            fi
          done
          echo "✅ All required CI checks passed!"
