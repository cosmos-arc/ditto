name: CI/CD Pipeline

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

env:
  PYTHON_DEFAULT_VERSION: "3.11"

jobs:
  quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install pixi
      uses: prefix-dev/setup-pixi@v0.4.1
      with:
        pixi-version: latest
        cache: true

    - name: Install dependencies
      run: pixi install

    - name: Run ruff checks
      run: |
        pixi run ruff check .
        if [ $? -ne 0 ]; then
          echo "::error::Ruff checks failed. All ruff issues must be fixed before merging."
          exit 1
        fi

    - name: Run ruff format
      run: |
        pixi run ruff format --check .
        if [ $? -ne 0 ]; then
          echo "::error::Code formatting issues found. Run 'pixi run ruff format .' to fix."
          exit 1
        fi

    - name: Type checking with mypy
      run: |
        pixi run mypy packages/core/src --strict
        if [ $? -ne 0 ]; then
          echo "::error::Type checking failed. Please fix type errors."
          exit 1
        fi

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: quality

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install pixi
      uses: prefix-dev/setup-pixi@v0.4.1
      with:
        pixi-version: latest
        cache: true

    - name: Install dependencies
      run: pixi install

    - name: Run tests
      run: |
        pixi run python -m pytest \
          --cov=packages/core/src \
          --cov-report=xml \
          --cov-report=html \
          --cov-fail-under=80 \
          -v

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [quality, test]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install pixi
      uses: prefix-dev/setup-pixi@v0.4.1
      with:
        pixi-version: latest
        cache: true

    - name: Install dependencies
      run: pixi install

    - name: Check imports
      run: |
        # Check that all modules can be imported
        pixi run python -c "
        import sys
        sys.path.insert(0, 'packages/core/src')
        try:
            import ditto_foundation.data
            print('✓ Data module imports successfully')
        except ImportError as e:
            print(f'✗ Import failed: {e}')
            sys.exit(1)
        "

    - name: Compile all Python files
      run: |
        # Ensure all Python files compile without syntax errors
        find . -name "*.py" -not -path "./.git/*" -not -path "./.pixi/*" | xargs pixi run python -m py_compile
        echo "✓ All Python files compile successfully"

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: quality

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install pixi
      uses: prefix-dev/setup-pixi@v0.4.1
      with:
        pixi-version: latest
        cache: true

    - name: Install dependencies
      run: pixi install

    - name: Run bandit security scan
      run: |
        pixi add --feature dev bandit
        pixi run bandit -r packages/core/src -f json -o bandit-report.json || true
        pixi run bandit -r packages/core/src

    - name: Upload security scan results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: bandit-report
        path: bandit-report.json

  pre-commit:
    name: Pre-commit Check
    runs-on: ubuntu-latest
    needs: quality

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install pixi
      uses: prefix-dev/setup-pixi@v0.4.1
      with:
        pixi-version: latest
        cache: true

    - name: Install dependencies
      run: |
        pixi install
        pixi add --feature dev pre-commit

    - name: Run pre-commit on all files
      run: |
        pixi run pre-commit run --all-files

  notify:
    name: Notify Status
    runs-on: ubuntu-latest
    needs: [quality, test, build, security]
    if: always()

    steps:
    - name: Notify success
      if: ${{ needs.quality.result == 'success' && needs.test.result == 'success' && needs.build.result == 'success' }}
      run: |
        echo "✅ All checks passed! Code is ready to merge."

    - name: Notify failure
      if: ${{ needs.quality.result == 'failure' || needs.test.result == 'failure' || needs.build.result == 'failure' }}
      run: |
        echo "::error::❌ CI checks failed. Please fix the issues before merging."
        exit 1