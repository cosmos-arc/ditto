# Ditto Integration Tests - GitHub Actions
#
# Uses the same docker-compose configuration as local development

name: Integration Tests

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"
  workflow_run:
    workflows: [CI]
    types:
      - completed
    branches: [main]

jobs:
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.39.5
          cache: true
          locked: true
          environment: dev

      # Create logs directory
      - name: Create logs directory
        run: mkdir -p logs

      # Start observability stack using docker compose (V2 plugin)
      - name: Start observability services
        working-directory: deploy/observability
        run: |
          # Start services using docker compose V2
          docker compose -f docker-compose.yml up -d

          # Wait for services to start
          echo "Waiting for services to start..."
          sleep 15

          # Show service status
          docker compose ps

      - name: Wait for services health
        working-directory: deploy/observability
        run: |
          # Check VictoriaMetrics
          for i in {1..30}; do
            if curl -sf http://localhost:8428/health > /dev/null 2>&1 || \
               curl -sf http://localhost:8428/metrics > /dev/null 2>&1; then
              echo "VictoriaMetrics is ready"
              break
            fi
            echo "Waiting for VictoriaMetrics... ($i/30)"
            sleep 2
          done

          # Check VictoriaLogs
          for i in {1..30}; do
            if curl -sf http://localhost:9428/health > /dev/null 2>&1; then
              echo "VictoriaLogs is ready"
              break
            fi
            echo "Waiting for VictoriaLogs... ($i/30)"
            sleep 2
          done

          # Check Grafana
          for i in {1..30}; do
            if curl -sf http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "Grafana is ready"
              break
            fi
            echo "Waiting for Grafana... ($i/30)"
            sleep 2
          done

      - name: Run integration tests
        run: |
          pixi run -e dev pytest \
            -m "integration" \
            --cov=packages \
            --cov=apps \
            --cov-report=xml:coverage-integration.xml \
            --cov-report=term-missing \
            --cov-fail-under=0 \
            --junitxml=junit-integration.xml \
            -v \
            --tb=short

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-integration.xml
          flags: integration
          fail_ci_if_error: false

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-integration
          path: junit-integration.xml
          retention-days: 30

      - name: Cleanup services
        if: always()
        working-directory: deploy/observability
        run: |
          docker compose -f docker-compose.yml down -v
