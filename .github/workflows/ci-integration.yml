# Ditto Integration Tests - GitHub Actions

name: Integration Tests

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"
  workflow_run:
    workflows: [CI]
    types:
      - completed
    branches: [main]

jobs:
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.39.5
          cache: true
          locked: true
          environment: dev

      # Start observability services on host network
      - name: Start observability services
        run: |
          # Create log directory for Vector
          mkdir -p logs

          # Create Vector config
          cat > vector-ci.toml << 'EOF'
          [sources.logs]
          type = "file"
          include = ["/logs/**/*.jsonl"]
          [sinks.victorialogs]
          type = "vector"
          inputs = ["logs"]
          address = "localhost:9428"
          EOF

          # Start services on host network so tests can access via localhost
          docker run -d --name ditto-vm \
            --network host \
            victoriametrics/victoria-metrics:v1.104.0 \
            --listenAddr=:8428

          docker run -d --name ditto-vl \
            --network host \
            victoriametrics/victoria-logs:v1.37.0 \
            --http.listenAddr=:9428

          docker run -d --name ditto-grafana \
            --network host \
            -e GF_AUTH_ANONYMOUS_ENABLED=true \
            -e GF_AUTH_ANONYMOUS_ORG_ROLE=Admin \
            -e GF_SERVER_ROOT_URL=http://localhost:3000 \
            -e GF_SERVER_HTTP_ADDR=0.0.0.0 \
            grafana/grafana:11.1.0

      - name: Wait for services
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:8428/health > /dev/null; then
              echo "VictoriaMetrics is ready"
              break
            fi
            echo "Waiting for VictoriaMetrics... ($i/30)"
            sleep 2
          done

          for i in {1..30}; do
            if curl -sf http://localhost:9428/health > /dev/null; then
              echo "VictoriaLogs is ready"
              break
            fi
            echo "Waiting for VictoriaLogs... ($i/30)"
            sleep 2
          done

          for i in {1..30}; do
            if curl -sf http://localhost:3000/api/health > /dev/null; then
              echo "Grafana is ready"
              break
            fi
            echo "Waiting for Grafana... ($i/30)"
            sleep 2
          done

      - name: Run integration tests
        run: |
          pixi run -e dev pytest \
            -m "integration" \
            --cov=packages \
            --cov=apps \
            --cov-report=xml:coverage-integration.xml \
            --cov-report=term-missing \
            --junitxml=junit-integration.xml \
            -v \
            --tb=short

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-integration.xml
          flags: integration
          fail_ci_if_error: false

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-integration
          path: junit-integration.xml
          retention-days: 30

      - name: Cleanup services
        if: always()
        run: |
          docker rm -f ditto-grafana ditto-vl ditto-vm || true
