name: Coverage Comment

on:
  pull_request:
    branches: [master, main]
    types: [opened, synchronize, reopened]

jobs:
  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Needed for coverage diff

    - name: Install pixi
      uses: prefix-dev/setup-pixi@v0.4.1
      with:
        pixi-version: latest
        cache: true
        cache-dependency-path: pixi.toml

    - name: Install dependencies
      run: |
        pixi install
        pixi add --feature test pytest pytest-cov

    - name: Generate coverage report
      run: |
        # Run tests with coverage
        pixi run python -m pytest \
          --cov=packages \
          --cov=apps \
          --cov-report=xml \
          --cov-report=html \
          --cov-report=term \
          --cov-branch \
          -v

    - name: Coverage diff with base branch
      id: coverage-diff
      run: |
        # Install coverage tools
        pip install coverage>=7.0

        # Get coverage percentage
        COVERAGE=$(pixi run python -c "
        import coverage
        cov = coverage.Coverage()
        cov.load()
        total = cov.report(file=open('/dev/null', 'w'))
        print(f'{total:.2f}')
        ")
        echo "coverage=${COVERAGE}" >> $GITHUB_OUTPUT

        # Calculate coverage diff
        BASE_BRANCH=${{ github.base_ref }}
        if [ "$BASE_BRANCH" = "" ]; then
          BASE_BRANCH="master"
        fi

        # Fetch base branch
        git fetch origin $BASE_BRANCH --depth=1

        # Show diff summary
        echo "## Coverage Summary" >> $GITHUB_STEP_SUMMARY
        echo "- Current Coverage: ${COVERAGE}%" >> $GITHUB_STEP_SUMMARY
        echo "- Base Branch: $BASE_BRANCH" >> $GITHUB_STEP_SUMMARY

    - name: Coverage comment
      uses: actions/github-script@v7
      if: github.event_name == 'pull_request'
      with:
        script: |
          const coverage = '${{ steps.coverage-diff.outputs.coverage }}';
          const threshold = 80;
          const status = parseFloat(coverage) >= threshold ? '✅' : '❌';

          const comment = `
          ## 📊 Coverage Report

          ${status} **Coverage: ${coverage}%** (Threshold: ${threshold}%)

          Coverage was generated for this pull request.

          ---

          *This comment is automatically generated by GitHub Actions*
          `;

          // Find existing coverage comment
          const { data: comments } = await github.rest.issues.listComments({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
          });

          const existingComment = comments.find(comment =>
            comment.body.includes('📊 Coverage Report') &&
            comment.user.type === 'Bot'
          );

          if (existingComment) {
            // Update existing comment
            await github.rest.issues.updateComment({
              comment_id: existingComment.id,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
          } else {
            // Create new comment
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
          }

    - name: Check coverage threshold
      run: |
        THRESHOLD=80
        COVERAGE=${{ steps.coverage-diff.outputs.coverage }}

        # Check if coverage meets threshold
        if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
          echo "::error::Coverage ${COVERAGE}% is below the required threshold of ${THRESHOLD}%"
          exit 1
        else
          echo "✅ Coverage ${COVERAGE}% meets the threshold of ${THRESHOLD}%"
        fi

    - name: Upload coverage artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-html-report
        path: htmlcov/
        retention-days: 7

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}
