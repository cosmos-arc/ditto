name: Release artifacts

on:
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]
  workflow_dispatch:
    inputs:
      version:
        description: Exact product version (for example 1.2.3-rc.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-cohort:
    name: Build and attest release cohort
    permissions:
      attestations: write
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Resolve immutable release identity
        id: identity
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = push ]; then
            product_version="${GITHUB_REF_NAME#v}"
          else
            product_version="$REQUESTED_VERSION"
          fi
          printf '%s' "$product_version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          generated_at="$(python3 -c 'from datetime import UTC, datetime; import sys; print(datetime.fromtimestamp(int(sys.argv[1]), UTC).strftime("%Y-%m-%dT%H:%M:%SZ"))' "$(git show -s --format=%ct "$GITHUB_SHA")")"
          contract_sha256="$(sha256sum contracts/openapi/v1.json | cut -d ' ' -f 1)"
          environment_lock_sha256="$(sha256sum pixi.lock | cut -d ' ' -f 1)"
          {
            echo "product_version=$product_version"
            echo "generated_at=$generated_at"
            echo "contract_sha256=$contract_sha256"
            echo "environment_lock_sha256=$environment_lock_sha256"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Prepare artifact directory
        run: mkdir -p dist
      - name: Install the frozen Web workspace
        run: bun install --frozen-lockfile
      - name: Build immutable Web release artifact
        env:
          DITTO_PRODUCT_VERSION: ${{ steps.identity.outputs.product_version }}
          DITTO_GIT_SHA: ${{ github.sha }}
          DITTO_API_CONTRACT_VERSION: v1
          DITTO_API_CONTRACT_SHA256: ${{ steps.identity.outputs.contract_sha256 }}
        run: |
          bun run --cwd apps/web build
          source_date_epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          tar \
            --sort=name \
            --mtime="@$source_date_epoch" \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            --format=gnu \
            --create \
            --file dist/ditto-web.tar \
            --directory apps/web/dist \
            .
      - name: Build OCI release artifact
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: false
          outputs: type=oci,dest=dist/ditto-image.tar
          build-args: |
            DITTO_PRODUCT_VERSION=${{ steps.identity.outputs.product_version }}
            DITTO_GIT_SHA=${{ github.sha }}
            DITTO_RESEARCH_ENVIRONMENT_LOCK_HASH=${{ steps.identity.outputs.environment_lock_sha256 }}
            DITTO_API_CONTRACT_VERSION=v1
            DITTO_API_CONTRACT_SHA256=${{ steps.identity.outputs.contract_sha256 }}
          provenance: false
          sbom: false
      - name: Generate SPDX SBOM from release subject
        run: |
          docker run --rm \
            --network none \
            --volume "$PWD/dist:/work" \
            ghcr.io/anchore/syft:v1.51.1@sha256:95fe0835e5bebc6f8b1f8acef68d47d63d594ef4c0f25c097ff853b23cbac74c \
            oci-archive:/work/ditto-image.tar \
            --output spdx-json=/work/ditto-backend.spdx.json
          docker run --rm \
            --network none \
            --volume "$PWD/apps/web/dist:/web:ro" \
            --volume "$PWD/dist:/work" \
            ghcr.io/anchore/syft:v1.51.1@sha256:95fe0835e5bebc6f8b1f8acef68d47d63d594ef4c0f25c097ff853b23cbac74c \
            dir:/web \
            --output spdx-json=/work/ditto-web.spdx.json
          test -s dist/ditto-backend.spdx.json
          test -s dist/ditto-web.spdx.json
          jq --exit-status '.spdxVersion | startswith("SPDX-")' dist/ditto-backend.spdx.json
          jq --exit-status '.spdxVersion | startswith("SPDX-")' dist/ditto-web.spdx.json
      - name: Generate release cohort manifest
        env:
          PRODUCT_VERSION: ${{ steps.identity.outputs.product_version }}
          GENERATED_AT: ${{ steps.identity.outputs.generated_at }}
        run: |
          python3 -m tooling.release.cohort_manifest \
            --workspace-root . \
            --artifact contracts/openapi/v1.json \
            --artifact pixi.lock \
            --artifact bun.lock \
            --artifact dist/ditto-image.tar \
            --artifact dist/ditto-backend.spdx.json \
            --artifact dist/ditto-web.tar \
            --artifact dist/ditto-web.spdx.json \
            --backend-artifact dist/ditto-image.tar \
            --web-artifact dist/ditto-web.tar \
            --product-version "$PRODUCT_VERSION" \
            --git-sha "$GITHUB_SHA" \
            --api-contract-version v1 \
            --api-contract-sha256 "${{ steps.identity.outputs.contract_sha256 }}" \
            --generated-at "$GENERATED_AT" \
            --output dist/release-cohort.json
          sha256sum \
            dist/ditto-image.tar \
            dist/ditto-backend.spdx.json \
            dist/ditto-web.tar \
            dist/ditto-web.spdx.json \
            dist/release-cohort.json \
            > dist/SHA256SUMS
      - name: Attest release provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/ditto-image.tar
            dist/ditto-backend.spdx.json
            dist/ditto-web.tar
            dist/ditto-web.spdx.json
            dist/release-cohort.json
            dist/SHA256SUMS
      - name: Upload immutable release cohort
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ditto-${{ steps.identity.outputs.product_version }}-${{ github.sha }}
          path: |
            dist/ditto-image.tar
            dist/ditto-backend.spdx.json
            dist/ditto-web.tar
            dist/ditto-web.spdx.json
            dist/release-cohort.json
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 90
      - name: Publish long-lived release evidence
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT_VERSION: ${{ steps.identity.outputs.product_version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Ditto $PRODUCT_VERSION" \
            --notes "Immutable release cohort for Git commit $GITHUB_SHA." \
            "dist/ditto-image.tar#Backend OCI artifact" \
            "dist/ditto-backend.spdx.json#Backend SPDX SBOM" \
            "dist/ditto-web.tar#Web static artifact" \
            "dist/ditto-web.spdx.json#Web SPDX SBOM" \
            "dist/release-cohort.json#Release cohort manifest" \
            "dist/SHA256SUMS#Artifact checksums"
