name: Release artifacts

on:
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]
  workflow_dispatch:
    inputs:
      version:
        description: Exact product version (for example 1.2.3-rc.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-cohort:
    name: Build and verify release cohort
    permissions:
      actions: read
      contents: read
    outputs:
      product-version: ${{ steps.identity.outputs.product_version }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release source provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          runs_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&per_page=100")"
          latest_conclusion="$(
            jq --raw-output --arg sha "$GITHUB_SHA" '
              [
                .workflow_runs[]
                | select(
                    .head_sha == $sha
                    and .event == "push"
                    and .head_branch == "main"
                  )
              ]
              | sort_by(.run_started_at // .created_at)
              | reverse
              | .[0].conclusion // ""
            ' <<<"$runs_json"
          )"
          test "$latest_conclusion" = "success"
      - uses: ./.github/actions/setup-bun
      - name: Resolve immutable release identity
        id: identity
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = push ]; then
            product_version="${GITHUB_REF_NAME#v}"
          else
            product_version="$REQUESTED_VERSION"
          fi
          printf '%s' "$product_version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          manifest_version="$(python3 -c 'import json; print(json.load(open("package.json", encoding="utf-8"))["version"])')"
          test "$product_version" = "$manifest_version"
          generated_at="$(python3 -c 'from datetime import UTC, datetime; import sys; print(datetime.fromtimestamp(int(sys.argv[1]), UTC).strftime("%Y-%m-%dT%H:%M:%SZ"))' "$(git show -s --format=%ct "$GITHUB_SHA")")"
          contract_sha256="$(sha256sum contracts/openapi/v1.json | cut -d ' ' -f 1)"
          environment_lock_sha256="$(python3 -m tooling.release.environment_identity)"
          {
            echo "product_version=$product_version"
            echo "generated_at=$generated_at"
            echo "contract_sha256=$contract_sha256"
            echo "environment_lock_sha256=$environment_lock_sha256"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Prepare artifact directory
        run: mkdir -p dist
      - name: Stage release inputs
        run: |
          for source in contracts/openapi/v1.json contracts/cohorts/compatibility-policy.json contracts/cohorts/compatibility-policy.sha256 uv.lock bun.lock .python-version deploy/docker/Dockerfile; do
            test -f "$source"
            test ! -L "$source"
          done
          mkdir -p dist/release-inputs/contracts/openapi
          mkdir -p dist/release-inputs/contracts/cohorts
          install -m 0644 contracts/cohorts/compatibility-policy.json dist/release-inputs/contracts/cohorts/compatibility-policy.json
          install -m 0644 contracts/cohorts/compatibility-policy.sha256 dist/release-inputs/contracts/cohorts/compatibility-policy.sha256
          install -m 0644 contracts/openapi/v1.json dist/release-inputs/contracts/openapi/v1.json
          install -m 0644 uv.lock dist/release-inputs/uv.lock
          install -m 0644 .python-version dist/release-inputs/.python-version
          install -m 0644 deploy/docker/Dockerfile dist/release-inputs/Dockerfile
          install -m 0644 bun.lock dist/release-inputs/bun.lock
          cmp contracts/openapi/v1.json dist/release-inputs/contracts/openapi/v1.json
          cmp uv.lock dist/release-inputs/uv.lock
          cmp bun.lock dist/release-inputs/bun.lock
          python3 -m tooling.release.cohort_bundle stage-tools \
            --source-root . \
            --workspace-root dist
      - name: Install the frozen Web workspace
        run: bun install --frozen-lockfile --registry=https://registry.npmjs.org
      - name: Build immutable Web release artifact
        env:
          DITTO_PRODUCT_VERSION: ${{ steps.identity.outputs.product_version }}
          DITTO_GIT_SHA: ${{ github.sha }}
          DITTO_API_CONTRACT_VERSION: v1
          DITTO_API_CONTRACT_SHA256: ${{ steps.identity.outputs.contract_sha256 }}
        run: |
          bun run --cwd apps/web build
          source_date_epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          tar \
            --sort=name \
            --mtime="@$source_date_epoch" \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            --format=gnu \
            --create \
            --file dist/ditto-web.tar \
            --directory apps/web/dist \
            .
      - name: Build OCI release artifact
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          file: deploy/docker/Dockerfile
          push: false
          load: true
          tags: ditto-release:${{ github.sha }}
          build-args: |
            DITTO_PRODUCT_VERSION=${{ steps.identity.outputs.product_version }}
            DITTO_GIT_SHA=${{ github.sha }}
            DITTO_RESEARCH_ENVIRONMENT_LOCK_HASH=${{ steps.identity.outputs.environment_lock_sha256 }}
            DITTO_API_CONTRACT_VERSION=v1
            DITTO_API_CONTRACT_SHA256=${{ steps.identity.outputs.contract_sha256 }}
          provenance: false
          sbom: false
      - name: Verify and export the release image
        env:
          IMAGE: ${{ steps.image.outputs.imageid }}
          PRODUCT_VERSION: ${{ steps.identity.outputs.product_version }}
          CONTRACT_SHA256: ${{ steps.identity.outputs.contract_sha256 }}
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' "$IMAGE")" = "65532:65532"
          container_id="$(docker run --detach --rm --env TUSHARE_TOKEN=ci-smoke-offline-credential --publish 127.0.0.1::8000 "$IMAGE")"
          trap 'docker logs "$container_id"; docker stop "$container_id"' EXIT
          port="$(docker port "$container_id" 8000/tcp | sed 's/.*://')"
          ready=0
          for attempt in $(seq 1 60); do
            echo "release readiness attempt $attempt/60"
            if curl --fail --silent --show-error "http://127.0.0.1:$port/readyz"; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1
          curl --fail --silent --show-error --max-time 5 "http://127.0.0.1:$port/api/v1/status" \
            | jq --exit-status --arg version "$PRODUCT_VERSION" --arg sha "$GITHUB_SHA" --arg contract "$CONTRACT_SHA256" \
                '.product_version == $version and .git_sha == $sha and .api_contract_version == "v1" and .api_contract_sha256 == $contract'
          docker stop "$container_id"
          trap - EXIT
          docker save --output dist/ditto-image.tar "$IMAGE"
          docker run --rm \
            --volume "$PWD/dist:/work" \
            --volume ditto-trivy-cache:/root/.cache/trivy \
            ghcr.io/aquasecurity/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            image --input /work/ditto-image.tar --format json --output /work/trivy-backend.json --exit-code 1 --severity HIGH,CRITICAL
          python3 -m tooling.release.artifact_gate scan-backend-sources \
            --output dist \
            --final-image "$IMAGE"
      - name: Generate SPDX SBOM from release subject
        env:
          PRODUCT_VERSION: ${{ steps.identity.outputs.product_version }}
          CONTRACT_SHA256: ${{ steps.identity.outputs.contract_sha256 }}
          GENERATED_AT: ${{ steps.identity.outputs.generated_at }}
        run: |
          mkdir -p "$RUNNER_TEMP/web-sbom/apps/web"
          install -m 0644 package.json bun.lock "$RUNNER_TEMP/web-sbom/"
          install -m 0644 apps/web/package.json "$RUNNER_TEMP/web-sbom/apps/web/package.json"
          docker run --rm \
            --network none \
            --volume "$PWD/dist:/work" \
            ghcr.io/anchore/syft:v1.51.1@sha256:95fe0835e5bebc6f8b1f8acef68d47d63d594ef4c0f25c097ff853b23cbac74c \
            docker-archive:/work/ditto-image.tar \
            --output spdx-json=/work/ditto-backend.spdx.json \
            --output syft-json=/work/ditto-backend.syft.json
          docker run --rm \
            --network none \
            --volume "$RUNNER_TEMP/web-sbom:/web:ro" \
            --volume "$PWD/dist:/work" \
            ghcr.io/anchore/syft:v1.51.1@sha256:95fe0835e5bebc6f8b1f8acef68d47d63d594ef4c0f25c097ff853b23cbac74c \
            dir:/web \
            --output spdx-json=/work/ditto-web.spdx.json
          python3 - <<'PY'
          import os
          from pathlib import Path
          from tooling.release.artifact_gate import (
              _archive_image_config,
              _verify_scanner_subject,
              _bind_and_verify_web_sbom,
              _bind_backend_source_provenance,
              _canonicalize_spdx_sbom,
              _verify_web_artifact_metadata,
          )
          from tooling.release.cohort_manifest import ReleaseCoordinates

          release = ReleaseCoordinates(
              product_version=os.environ["PRODUCT_VERSION"],
              git_sha=os.environ["GITHUB_SHA"],
              api_contract_version="v1",
              api_contract_sha256=os.environ["CONTRACT_SHA256"],
              generated_at=os.environ["GENERATED_AT"],
          )
          config_digest = _archive_image_config(Path("dist/ditto-image.tar"))
          _verify_scanner_subject(Path("dist/ditto-backend.syft.json"), image=config_digest, scanner="syft")
          _verify_scanner_subject(Path("dist/trivy-backend.json"), image=config_digest, scanner="trivy")
          # scan-backend-sources already binds each report to its selected amd64
          # archive ImageID and verifies vulnerable copied files against the final
          # image. Rechecking without that ImageID rejects valid digest-only scans.
          _bind_backend_source_provenance(
              Path("dist/ditto-backend.spdx.json"),
              Path("dist/ditto-backend-source-provenance.spdx.json"),
          )
          _verify_web_artifact_metadata(Path("dist/ditto-web.tar"), release=release)
          _canonicalize_spdx_sbom(Path("dist/ditto-backend.spdx.json"), label="backend SPDX SBOM")
          _bind_and_verify_web_sbom(
              Path("dist/ditto-web.spdx.json"),
              web_tar=Path("dist/ditto-web.tar"),
              package_manifest=Path("apps/web/package.json"),
          )
          PY
      - name: Generate and verify release cohort manifest
        env:
          PRODUCT_VERSION: ${{ steps.identity.outputs.product_version }}
          GENERATED_AT: ${{ steps.identity.outputs.generated_at }}
        run: |
          python3 -m tooling.release.cohort_manifest \
            --workspace-root dist \
            --artifact release-inputs/contracts/openapi/v1.json \
            --artifact release-inputs/contracts/cohorts/compatibility-policy.json \
            --artifact release-inputs/contracts/cohorts/compatibility-policy.sha256 \
            --artifact release-inputs/uv.lock \
            --artifact release-inputs/.python-version \
            --artifact release-inputs/Dockerfile \
            --artifact release-inputs/bun.lock \
            --artifact release-tools/tooling/__init__.py \
            --artifact release-tools/tooling/release/__init__.py \
            --artifact release-tools/tooling/release/cohort_manifest.py \
            --artifact release-tools/tooling/release/cohort_verify.py \
            --artifact release-tools/tooling/release/environment_identity.py \
            --artifact release-tools/verify-cohort.py \
            --artifact ditto-image.tar \
            --artifact ditto-backend.spdx.json \
            --artifact trivy-backend-source-runtime-libraries.json \
            --artifact trivy-backend-source-debian-libraries.json \
            --artifact ditto-backend-source-provenance.spdx.json \
            --artifact ditto-web.tar \
            --artifact ditto-web.spdx.json \
            --backend-artifact ditto-image.tar \
            --web-artifact ditto-web.tar \
            --product-version "$PRODUCT_VERSION" \
            --git-sha "$GITHUB_SHA" \
            --api-contract-version v1 \
            --api-contract-sha256 "${{ steps.identity.outputs.contract_sha256 }}" \
            --generated-at "$GENERATED_AT" \
            --output release-cohort.json
          python3 -m tooling.release.cohort_verify \
            --workspace-root dist \
            --manifest release-cohort.json
          python3 -m tooling.release.compatibility_policy register-previous \
            --workspace-root dist \
            --release-manifest dist/release-cohort.json \
            --output-policy dist/next-cohort-policy/compatibility-policy.json \
            --output-digest dist/next-cohort-policy/compatibility-policy.sha256
          python3 -m tooling.release.cohort_bundle create \
            --workspace-root dist \
            --manifest release-cohort.json \
            --include next-cohort-policy/compatibility-policy.json \
            --include next-cohort-policy/compatibility-policy.sha256 \
            --output ditto-release-cohort.tar \
            --source-date-epoch "$(git show -s --format=%ct "$GITHUB_SHA")"
          (
            cd dist
            sha256sum \
              ditto-image.tar \
              ditto-backend.spdx.json \
              trivy-backend-source-runtime-libraries.json \
              trivy-backend-source-debian-libraries.json \
              ditto-backend-source-provenance.spdx.json \
              ditto-web.tar \
              ditto-web.spdx.json \
              release-inputs/contracts/openapi/v1.json \
              release-inputs/uv.lock \
              release-inputs/.python-version \
              release-inputs/Dockerfile \
              release-inputs/bun.lock \
              release-cohort.json \
              next-cohort-policy/compatibility-policy.json \
              next-cohort-policy/compatibility-policy.sha256 \
              ditto-release-cohort.tar \
              > SHA256SUMS
          )

      - name: Upload verified release staging
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ditto-release-staging-${{ github.sha }}
          path: dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  publish-cohort:
    name: Attest and publish release cohort
    needs: release-cohort
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download verified release staging
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: ditto-release-staging-${{ github.sha }}
          path: dist
      - name: Verify staged artifact integrity
        run: |
          test -f dist/SHA256SUMS
          (cd dist && sha256sum --check --strict SHA256SUMS)
      - name: Attest release provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/ditto-image.tar
            dist/ditto-backend.spdx.json
            dist/ditto-backend-source-provenance.spdx.json
            dist/ditto-web.tar
            dist/ditto-web.spdx.json
            dist/release-inputs/contracts/openapi/v1.json
            dist/release-inputs/uv.lock
            dist/release-inputs/.python-version
            dist/release-inputs/Dockerfile
            dist/release-inputs/bun.lock
            dist/release-cohort.json
            dist/next-cohort-policy/compatibility-policy.json
            dist/next-cohort-policy/compatibility-policy.sha256
            dist/ditto-release-cohort.tar
            dist/SHA256SUMS
      - name: Export and verify attestation bundle
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          test -n "$ATTESTATION_BUNDLE"
          test -s "$ATTESTATION_BUNDLE"
          install -m 0644 "$ATTESTATION_BUNDLE" dist/ditto-release-cohort.attestation.json
          gh attestation verify dist/ditto-release-cohort.tar \
            --repo "$GITHUB_REPOSITORY" \
            --bundle dist/ditto-release-cohort.attestation.json \
            --signer-workflow "github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-digest "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --deny-self-hosted-runners
      - name: Upload immutable release cohort
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ditto-${{ needs.release-cohort.outputs.product-version }}-${{ github.sha }}
          path: |
            dist/ditto-image.tar
            dist/ditto-backend.spdx.json
            dist/ditto-backend-source-provenance.spdx.json
            dist/ditto-web.tar
            dist/ditto-web.spdx.json
            dist/release-inputs/contracts/openapi/v1.json
            dist/release-inputs/uv.lock
            dist/release-inputs/.python-version
            dist/release-inputs/Dockerfile
            dist/release-inputs/bun.lock
            dist/release-cohort.json
            dist/next-cohort-policy/compatibility-policy.json
            dist/next-cohort-policy/compatibility-policy.sha256
            dist/ditto-release-cohort.tar
            dist/ditto-release-cohort.attestation.json
            dist/SHA256SUMS
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Publish long-lived release evidence
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT_VERSION: ${{ needs.release-cohort.outputs.product-version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Ditto $PRODUCT_VERSION" \
            --notes "Immutable release cohort for Git commit $GITHUB_SHA." \
            "dist/ditto-image.tar#Backend container image artifact" \
            "dist/ditto-backend.spdx.json#Backend SPDX SBOM" \
            "dist/ditto-backend-source-provenance.spdx.json#Backend copied-library source provenance SPDX SBOM" \
            "dist/trivy-backend-source-runtime-libraries.json#Runtime-library source Trivy raw report" \
            "dist/trivy-backend-source-debian-libraries.json#Debian-library source Trivy raw report" \
            "dist/ditto-web.tar#Web static artifact" \
            "dist/ditto-web.spdx.json#Web SPDX SBOM" \
            "dist/release-inputs/contracts/openapi/v1.json#OpenAPI contract release input" \
            "dist/release-inputs/uv.lock#Python environment release input" \
            "dist/release-inputs/.python-version#Python interpreter version" \
            "dist/release-inputs/Dockerfile#Python interpreter source" \
            "dist/release-inputs/bun.lock#Web dependency release input" \
            "dist/release-cohort.json#Release cohort manifest" \
            "dist/next-cohort-policy/compatibility-policy.json#Next release compatibility policy candidate" \
            "dist/next-cohort-policy/compatibility-policy.sha256#Next release compatibility policy digest" \
            "dist/ditto-release-cohort.tar#Portable self-verifying release cohort" \
            "dist/ditto-release-cohort.attestation.json#Sigstore attestation bundle for offline verification" \
            "dist/SHA256SUMS#Artifact checksums"
