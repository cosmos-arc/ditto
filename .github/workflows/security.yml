name: Security

on:
  workflow_call:
    inputs:
      full-analysis:
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    if: ${{ inputs.full-analysis }}
    name: CodeQL (${{ matrix.language }})
    permissions:
      actions: read
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - name: Analyze locally
        id: analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          upload: never
          upload-database: false
          output: build/codeql
      - name: Preserve analysis evidence independently of upload capability
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-${{ matrix.language }}-${{ github.run_id }}
          path: build/codeql
          if-no-files-found: error
          retention-days: 30
      - name: Upload to Code Scanning (requires repository service entitlement)
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: build/codeql

  gitleaks:
    name: Secret history scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Current Gitleaks full-history scan
        run: |
          docker run --rm \
            --network none \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:/repo:ro" \
            --workdir /repo \
            docker.io/zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact --no-banner --exit-code 1 --log-opts=--all .
      - name: Known-good Gitleaks compatibility scan
        run: |
          docker run --rm \
            --network none \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:/repo:ro" \
            --workdir /repo \
            ghcr.io/gitleaks/gitleaks:v8.18.4@sha256:75bdb2b2f4db213cde0b8295f13a88d6b333091bbfbf3012a4e083d00d31caba \
            detect --source . --redact --no-banner --exit-code 1 --log-opts=--all
      - name: Prove the detector catches a canonical token
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks-sentinel"
          printf '%s\n' 'token = "ghp_aBcDeFgHiJkLmNoPqRsTuVwXyZ0123456789"' > "$RUNNER_TEMP/gitleaks-sentinel/leak.txt" # gitleaks:allow
          set +e
          docker run --rm \
            --network none \
            --user "$(id -u):$(id -g)" \
            --volume "$RUNNER_TEMP/gitleaks-sentinel:/probe:ro" \
            ghcr.io/gitleaks/gitleaks:v8.18.4@sha256:75bdb2b2f4db213cde0b8295f13a88d6b333091bbfbf3012a4e083d00d31caba \
            detect --no-git --source /probe/leak.txt --redact --no-banner --exit-code 23
          sentinel_status=$?
          set -e
          test "$sentinel_status" -eq 23

  osv:
    if: ${{ inputs.full-analysis }}
    name: OSV lockfile scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: OSV fail-closed recursive scan
        run: |
          docker run --rm \
            --env HOME=/tmp \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:/src:ro" \
            --workdir /src \
            ghcr.io/google/osv-scanner:v2.5.1@sha256:8108ae94eadea5a02c9bec6e646909d5b790b44bd62d7f5b7f0b1d6d0ffc7734 \
            scan source --recursive ./

  mutation-critical:
    name: Weekly critical mutation gate
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.73.0
          cache: true
          frozen: true
          environments: dev
      - name: Run critical pure-function mutation gate
        run: pixi run -e dev mutation-critical
      - name: Upload mutation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-critical-${{ github.run_id }}
          path: build/mutation/mutmut-cicd-stats.json
          if-no-files-found: error
          retention-days: 30

  security-gate:
    name: Security gate
    if: ${{ always() }}
    needs: [codeql, gitleaks, osv, mutation-critical]
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Require selected security checks and weekly mutation
        env:
          FULL_ANALYSIS: ${{ inputs.full-analysis }}
          WEEKLY: ${{ github.event_name == 'schedule' }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
          OSV_RESULT: ${{ needs.osv.result }}
          MUTATION_RESULT: ${{ needs.mutation-critical.result }}
        run: |
          test "$GITLEAKS_RESULT" = success
          for result in "$CODEQL_RESULT" "$OSV_RESULT"; do
            if test "$FULL_ANALYSIS" = true; then
              test "$result" = success
            else
              test "$result" = skipped
            fi
          done
          if test "$WEEKLY" = true; then
            test "$MUTATION_RESULT" = success
          else
            test "$MUTATION_RESULT" = skipped
          fi
