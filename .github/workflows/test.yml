name: Tests

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  PYTHON_DEFAULT_VERSION: "3.11"

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12"]
        exclude:
          # Reduce matrix size for faster CI
          - os: ubuntu-latest
            python-version: "3.12"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Needed for coverage

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install pixi
      uses: prefix-dev/setup-pixi@v0.4.1
      with:
        pixi-version: latest
        cache: true
        cache-dependency-path: pixi.toml

    - name: Install dependencies
      run: |
        pixi install
        # Ensure test dependencies are installed
        pixi add --feature test pytest pytest-cov pytest-mock pytest-asyncio

    - name: Verify Python environment
      run: |
        pixi run python --version
        pixi run python -c "import sys; print(sys.path)"

    - name: Compile all Python files
      shell: bash
      run: |
        # Check syntax compilation
        if [ "$RUNNER_OS" == "Windows" ]; then
          # Windows PowerShell
          pixi run python -m py_compile $(git ls-files '*.py')
        else
          # Unix shell
          pixi run python -m py_compile $(git ls-files '*.py')
        fi
        echo "✅ All Python files compile successfully"

    - name: Test imports
      run: |
        # Test that all main modules can be imported
        pixi run python -c "
        import sys
        import os
        sys.path.insert(0, 'packages/core/src')
        sys.path.insert(0, 'packages/foundation/src')
        sys.path.insert(0, 'apps/server/src')

        # Test core imports
        try:
            from ditto_foundation.config import Settings
            print('✓ Foundation config imports successfully')
        except ImportError as e:
            print(f'✗ Foundation import failed: {e}')

        # Add more import tests as modules become available
        print('✅ Import tests completed')
        "

    - name: Run tests
      shell: bash
      run: |
        # Run pytest with coverage
        pixi run python -m pytest \
          --cov=packages \
          --cov=apps \
          --cov-report=xml:coverage.xml \
          --cov-report=html:htmlcov \
          --cov-report=term-missing \
          --cov-branch \
          --cov-fail-under=80 \
          -v \
          --tb=short \
          --durations=10

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false

    - name: Upload coverage artifacts
      uses: actions/upload-artifact@v4
      if: always() && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      with:
        name: coverage-report-${{ matrix.os }}
        path: htmlcov/
        retention-days: 30

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.os }}-py${{ matrix.python-version }}
        path: |
          test-results/
          pytest.xml
        retention-days: 7
