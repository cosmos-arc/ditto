name: Code Quality

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint and Format
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install pixi
      uses: prefix-dev/setup-pixi@v0.4.1
      with:
        pixi-version: latest
        cache: true
        cache-dependency-path: pixi.toml

    - name: Install dependencies
      run: pixi install

    - name: Run ruff linter
      run: |
        pixi run ruff check . --output-format=github
        if [ $? -ne 0 ]; then
          echo "::error::Ruff linter found issues that must be fixed."
          exit 1
        fi

    - name: Run ruff formatter check
      run: |
        pixi run ruff format --check .
        if [ $? -ne 0 ]; then
          echo "::error::Code is not properly formatted. Run 'pixi run ruff format .' to fix."
          exit 1
        fi

  type-check:
    name: Type Checking
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install pixi
      uses: prefix-dev/setup-pixi@v0.4.1
      with:
        pixi-version: latest
        cache: true
        cache-dependency-path: pixi.toml

    - name: Install dependencies
      run: pixi install

    - name: Run mypy
      run: |
        # Check all packages and apps
        pixi run mypy packages/ apps/ scripts/ tests/ \
          --show-error-codes \
          --no-error-summary \
          --hide-error-context
        if [ $? -ne 0 ]; then
          echo "::error::Type checking failed. Please fix type errors."
          exit 1
        fi

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install pixi
      uses: prefix-dev/setup-pixi@v0.4.1
      with:
        pixi-version: latest
        cache: true
        cache-dependency-path: pixi.toml

    - name: Install dependencies
      run: |
        pixi install
        # Install bandit for security scanning
        pixi add --feature security bandit[toml]

    - name: Run bandit security scan
      run: |
        # Run bandit on source code only (exclude tests)
        pixi run bandit -r packages/ apps/ scripts/ \
          -f json \
          -o bandit-report.json \
          || true  # Don't fail the build, just collect results

        # Run again to show output in logs
        pixi run bandit -r packages/ apps/ scripts/

    - name: Upload security scan results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: bandit-security-report
        path: bandit-report.json
        retention-days: 30

  pre-commit:
    name: Pre-commit Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install pixi
      uses: prefix-dev/setup-pixi@v0.4.1
      with:
        pixi-version: latest
        cache: true
        cache-dependency-path: pixi.toml

    - name: Install dependencies
      run: |
        pixi install
        # Install pre-commit
        pixi add --feature dev pre-commit

    - name: Cache pre-commit
      uses: actions/cache@v4
      with:
        path: ~/.cache/pre-commit
        key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

    - name: Run pre-commit
      run: |
        pixi run pre-commit run --all-files --show-diff-on-failure
