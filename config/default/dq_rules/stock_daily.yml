# 股票日频数据 DQ 规则
dataset: stock_daily
description: "股票日 K 线数据质量检查规则"

# 技术类：结构约束（写入时强制阻断）
technical:
  - rule: not_null
    columns: [instrument_id, trade_date, open, high, low, close, volume, amount]
    message: "必填字段不能为空"

  - rule: unique
    columns: [instrument_id, trade_date]
    message: "主键 (instrument_id, trade_date) 重复"

  - rule: foreign_key
    column: instrument_id
    reference: security.instrument_id
    message: "SID 不存在于证券主表"

  - rule: type_check
    columns:
      instrument_id: int
      trade_date: date
      open: float
      high: float
      low: float
      close: float
      volume: int
      amount: float
    message: "字段类型不匹配"

# 业务类：业务规则（写入时警告但不阻断）
business:
  - rule: positive
    columns: [open, high, low, close, volume, amount]
    message: "OHLC 价格、成交额必须为正数"

  - rule: expression
    name: ohlc_consistency
    expr: "high >= low AND high >= open AND high >= close AND low <= open AND low <= close"
    message: "OHLC 关系不一致：high 应为最大值，low 应为最小值"

  - rule: expression
    name: amount_volume_consistency
    expr: "amount >= close * volume OR amount == 0"
    message: "成交额与成交量、收盘价关系异常"

  - rule: range_check
    column: close
    min_ratio: 0.01  # 相对前一日涨跌幅不超过 99%
    max_ratio: 1.11  # 相对前一日涨跌幅不超过 11%
    message: "收盘价涨跌幅超出正常范围"

# 统计类：异常检测（定时批量检查）
statistical:
  - rule: zscore
    name: volume_spike
    column: volume
    window: 60
    threshold: 5
    group_by: instrument_id
    message: "成交量异常波动（Z-score > 5）"

  - rule: zscore
    name: amount_spike
    column: amount
    window: 60
    threshold: 5
    group_by: instrument_id
    message: "成交额异常波动（Z-score > 5）"

  - rule: completeness
    name: missing_data_check
    expected_dates: "trade_calendar"
    lookback_days: 5
    message: "最近 5 个交易日存在缺失数据"

  - rule: stale_price
    name: price_frozen
    column: close
    threshold_days: 3
    message: "价格连续 3 日无变化（停牌或异常）"

  # 跨源对比：Tushare vs 通达信
  # 使用 symbol 作为对比 key_column（统一格式，不依赖数据源）
  - rule: cross_source_compare
    key_columns: [symbol, trade_date]
    fields: [open, high, low, close, vol, amount]
    tolerance_rules:
      # 价格类：严格 Tick 对齐（0.001 元）
      open:
        method: tick_aligned
        tick_size: 0.001
      high:
        method: tick_aligned
        tick_size: 0.001
      low:
        method: tick_aligned
        tick_size: 0.001
      close:
        method: tick_aligned
        tick_size: 0.001
      # 成交量：相对容差 0.1%（数量级差异大，用相对容差）
      vol:
        method: relative
        relative_tol: 0.001
      # 成交额：相对容差 0.1%
      amount:
        method: relative
        relative_tol: 0.001
    message: "与通达信数据对比发现差异"
    enabled: true
