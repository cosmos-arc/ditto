# 估值指标 DQ 规则
dataset: valuation_metrics
description: "估值指标数据质量检查规则"

# 技术类: 技术校验（写入时强制阻断）
technical:
  - rule: not_null
    columns: [instrument_id, trade_date]
    message: "必填字段不能为空"

  - rule: unique
    columns: [instrument_id, trade_date, effective_from]
    message: "主键 (instrument_id, trade_date, effective_from) 重复"

  - rule: foreign_key
    column: instrument_id
    reference: instrument.instrument_id
    message: "Instrument ID 不存在于证券主表"

  - rule: type_check
    columns:
      instrument_id: int
      trade_date: date
      pe_ratio: float
      pb_ratio: float
      ps_ratio: float
      dividend_yield: float
      market_cap: float
    message: "字段类型不匹配"

# 业务类: 业务规则（写入时警告但不阻断）
business:
  - rule: positive
    columns: [pe_ratio, pb_ratio, ps_ratio, market_cap]
    message: "PE、PB、PS、总市值必须为正数"
