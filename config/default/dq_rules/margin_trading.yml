# 融资融券 DQ 规则
dataset: margin_trading
description: "融资融券数据质量检查规则"

# 技术类: 技术校验（写入时强制阻断）
technical:
  - rule: not_null
    columns: [instrument_id, trade_date, margin_buy_balance, short_sell_balance]
    message: "必填字段不能为空"

  - rule: unique
    columns: [instrument_id, trade_date, effective_from]
    message: "主键 (instrument_id, trade_date, effective_from) 重复"

  - rule: foreign_key
    column: instrument_id
    reference: instrument.instrument_id
    message: "Instrument ID 不存在于证券主表"

  - rule: type_check
    columns:
      instrument_id: int
      trade_date: date
      margin_buy_balance: float
      short_sell_balance: float
      margin_buy_volume: float
      short_sell_volume: float
    message: "字段类型不匹配"

# 业务类: 业务规则（写入时警告但不阻断）
business:
  - rule: positive
    columns: [margin_buy_balance, short_sell_balance, margin_buy_volume, short_sell_volume]
    message: "融资融券余额和交易量必须为正数"
