# 融资融券 DQ 规则
dataset: margin_trading
description: "融资融券数据质量检查规则"

# 技术类: 技术校验（写入时强制阻断）
technical:
  - rule: not_null
    columns: [source_ticker, trade_date]
    message: "业务键不能为空"
    # 余额列（margin_buy_balance/short_sell_balance）不设 not_null（#625）：
    # 交易所月末披露形态含 null 余额（2019-09-30 实测 DQ 拦截根因），存储
    # schema 亦按 nullable 设计；未披露≠零值。

  - rule: unique
    columns: [source_ticker, trade_date, effective_from]
    message: "主键 (source_ticker, trade_date, effective_from) 重复"

  - rule: type_check
    columns:
      trade_date: date
      margin_buy_balance: float
      short_sell_balance: float
      margin_buy_amount: float
      short_sell_volume: float
    message: "字段类型不匹配"

# 业务类: 业务规则（写入时警告但不阻断）
business:
  - rule: positive
    columns: [margin_buy_balance, short_sell_balance, margin_buy_amount, short_sell_volume]
    message: "融资融券余额和交易量必须为正数"
