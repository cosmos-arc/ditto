# 龙虎榜个股明细 DQ 规则（#519）
# 单位：金额全部元、比率 %。同标的同日可因多个上榜原因出现多行
# （reason 进主键）。事件型，勿套用日历完整性。
dataset: top_list
description: "top_list 数据质量检查规则"

technical:
  - rule: not_null
    columns: [source_ticker, trade_date, reason, knowledge_date]
    message: "必填字段不能为空"

  - rule: unique
    columns: [source_ticker, trade_date, reason, knowledge_date]
    message: "主键 (source_ticker, trade_date, reason, knowledge_date) 重复"

  - rule: type_check
    columns:
      instrument_id: int
      trade_date: date
      knowledge_date: date
      reason: string
      close: float
      l_buy: float
    message: "字段类型不匹配"

# 业务类: 业务规则（写入时警告但不阻断）
business: []
