# 现金流量表 DQ 规则
dataset: cash_flow
description: "现金流量表数据质量检查规则"

# 技术类: 技术校验（写入时强制阻断）
technical:
  - rule: not_null
    columns: [source_ticker, report_date]
    message: "必填字段不能为空"

  - rule: unique
    columns: [source_ticker, report_date, effective_from]
    message: "主键 (source_ticker, report_date, effective_from) 重复"

  - rule: type_check
    columns:
      instrument_id: int
      report_date: date
      knowledge_date: date
      effective_from: date
      effective_to: date
      operating_cash_flow: float
      investing_cash_flow: float
      financing_cash_flow: float
      net_cash_flow: float
    message: "字段类型不匹配"

# 业务类: 业务规则（写入时警告但不阻断）
business:
  - rule: expression
    name: cash_flow_consistency
    expr: "net_cash_flow == operating_cash_flow + investing_cash_flow + financing_cash_flow"
    message: "净现金流与三大现金流之和不一致"

# 统计类: 跨源对账（#473）
statistical:
  # 主源 Tushare 现金流量表 vs 辅源 fuyao 现金流量表数值交叉。
  # 只比较三大活动净额；主源 net_cash_flow 是三项之和（computed），
  # fuyao cash_equivalents_net_addition 为现金及等价物净增加额（含汇率
  # 变动影响等），口径不可等价——不注册比较（单列口径差异，不折算）。
  - rule: cross_source_compare
    key_columns: [instrument_id, report_date]
    fields: [operating_cash_flow, investing_cash_flow, financing_cash_flow]
    tolerance_rules:
      operating_cash_flow:
        method: relative
        relative_tol: 0.0001
      investing_cash_flow:
        method: relative
        relative_tol: 0.0001
      financing_cash_flow:
        method: relative
        relative_tol: 0.0001
    message: "与辅源(fuyao)现金流量表数值交叉发现差异"
    enabled: true
