# 分红数据 DQ 规则
dataset: dividend
description: "分红数据质量检查规则"

# 技术类: 技术校验（写入时强制阻断）
technical:
  - rule: not_null
    columns: [source_ticker, knowledge_date]
    message: "源代码和公告日不能为空；预案阶段除权日允许为空"

  - rule: unique
    columns: [source_ticker, knowledge_date, ex_dividend_date, dividend_per_share, div_proc]
    message: "分红公告业务行 (source_ticker, knowledge_date, ex_dividend_date, dividend_per_share, div_proc) 重复"

  - rule: foreign_key
    column: instrument_id
    reference: instrument.instrument_id
    message: "Instrument ID 不存在于证券主表"

  - rule: type_check
    columns:
      instrument_id: int
      ex_dividend_date: date
      dividend_per_share: float
      dividend_yield: float
    message: "字段类型不匹配"

# 业务类: 业务规则（写入时警告但不阻断）
business:
  - rule: range_check
    column: dividend_per_share
    min: 0
    message: "每股股利不应为负数"
