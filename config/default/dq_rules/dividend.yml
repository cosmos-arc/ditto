# 分红数据 DQ 规则
dataset: dividend
description: "分红数据质量检查规则"

# 技术类: 技术校验（写入时强制阻断）
technical:
  - rule: not_null
    columns: [instrument_id, ex_dividend_date]
    message: "必填字段不能为空"

  - rule: unique
    columns: [instrument_id, ex_dividend_date, effective_from]
    message: "主键 (instrument_id, ex_dividend_date, effective_from) 重复"

  - rule: foreign_key
    column: instrument_id
    reference: instrument.instrument_id
    message: "Instrument ID 不存在于证券主表"

  - rule: type_check
    columns:
      instrument_id: int
      ex_dividend_date: date
      dividend_per_share: float
      dividend_yield: float
    message: "字段类型不匹配"

# 业务类: 业务规则（写入时警告但不阻断）
business:
  - rule: range_check
    column: dividend_per_share
    min: 0
    message: "每股股利不应为负数"
