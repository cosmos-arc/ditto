# 公司行为 DQ 规则
dataset: corporate_actions
description: "公司行为数据质量检查规则"

# 技术类: 技术校验（写入时强制阻断）
technical:
  - rule: not_null
    columns: [source_ticker, action_type, action_date]
    message: "必填字段不能为空"

  # 不设 unique：事件表无稳定业务主键——同股同日同类型同持有人可存在
  # 多笔独立事件（分笔解禁/分笔回购，2014H1 实测三列键 92% 撞、四列键
  # 含 description 后仍 28/24.9万 行真实多笔）；重复摄取由 partition
  # checkpoint 幂等防，不靠表级唯一性。
  - rule: type_check
    columns:
      action_type: str
      action_date: date
      knowledge_date: date
      effective_from: date
      effective_to: date
      description: str
    message: "字段类型不匹配"

# 业务类: 业务规则（写入时警告但不阻断）
business:
  - rule: expression
    name: valid_action_type
    expr: "action_type IN ('split', 'dividend', 'rights_issue', 'bonus_share', 'spinoff', 'merger', 'delisting')"
    message: "公司行为类型不在已知范围内"
