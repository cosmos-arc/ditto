# 复权因子 DQ 规则
dataset: adj_factor
description: "复权因子数据质量检查规则"

# 技术类: 技术校验（写入时强制阻断）
technical:
  - rule: not_null
    # #515 G2：knowledge_date=trade_date 由映射构造、恒非空，纳入 not_null
    columns: [source_ticker, trade_date, knowledge_date, adj_factor]
    message: "必填字段不能为空"

  - rule: unique
    columns: [source_ticker, trade_date]
    message: "主键 (source_ticker, trade_date) 重复"

  - rule: type_check
    columns:
      instrument_id: int
      trade_date: date
      adj_factor: float
    message: "字段类型不匹配"

# 业务类: 业务规则（写入时警告但不阻断）
# #515 清理：移除 monotonic_decrease/expression(reasonable_range)——
# BusinessChecker 不分派前者，expression 只实现 ohlc 族；两者自始未生效
# （#514 fund_adj.yml 建档时发现的既有死配置，本票收口）。若需边界/单调
# 约束，按真实分派器重写并验证边界（累积因子可合法 >100），不复活死配置。
business:
  - rule: positive
    columns: [adj_factor]
    message: "复权因子必须为正数"

# 统计类: 统计异常（定时批量检查）
# #515 清理：移除 outlier(sudden_change)/consistency(cross_check_with_price)
# ——StatisticalChecker 无对应分派（zscore/completeness/
# suspension_contradiction 之外均静默跳过），同为自始未生效的死配置。
statistical:
  - rule: completeness
    name: missing_adj_factor
    expected_dates: "trade_calendar"
    lookback_days: 5
    message: "最近 5 个交易日存在缺失的复权因子数据"

  # 跨源对比：主源 Tushare 累积因子 vs 辅源 fuyao 事件流（#438）
  # 不比较绝对因子（基期可能不同）：两侧各自推导同基准除权比例后按
  # adjustment_ratio 相对容差比较；缺前价/缺配股价事件单列不可推导，
  # 零交集 = not_comparable 不算通过。容差覆盖交易所除权参考价 0.01 元
  # 取整在低价股上的相对误差。
  - rule: cross_source_compare
    key_columns: [instrument_id, trade_date]
    fields: [adjustment_ratio]
    tolerance_rules:
      adjustment_ratio:
        method: relative
        relative_tol: 0.005
    message: "与辅源(fuyao)除权比例对比发现差异"
    enabled: true
