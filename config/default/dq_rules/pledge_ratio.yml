# 股权质押 DQ 规则
dataset: pledge_ratio
description: "股权质押数据质量检查规则"

# 技术类: 技术校验（写入时强制阻断）
technical:
  - rule: not_null
    columns: [instrument_id, report_date, pledge_ratio, total_shares]
    message: "必填字段不能为空"

  - rule: unique
    columns: [instrument_id, report_date, effective_from]
    message: "主键 (instrument_id, report_date, effective_from) 重复"

  - rule: foreign_key
    column: instrument_id
    reference: instrument.instrument_id
    message: "Instrument ID 不存在于证券主表"

  - rule: type_check
    columns:
      instrument_id: int
      report_date: date
      pledge_ratio: float
      total_shares: float
    message: "字段类型不匹配"

# 业务类: 业务规则（写入时警告但不阻断）
business:
  - rule: expression
    name: pledge_ratio_range
    expr: "pledge_ratio >= 0 AND pledge_ratio <= 1"
    message: "质押比例应在 [0, 1] 范围内"
