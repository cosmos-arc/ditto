# 个股资金流向 DQ 规则（#518）
# 单位（#506 坑 F 登记，2026-10-06 实测）：金额字段全部万元、量字段全部手；
# net_mf_* = 买入-卖出（带符号）。
dataset: moneyflow
description: "moneyflow 数据质量检查规则"

technical:
  - rule: not_null
    columns: [source_ticker, trade_date, knowledge_date]
    message: "必填字段不能为空"

  - rule: unique
    columns: [source_ticker, trade_date, knowledge_date]
    message: "主键 (source_ticker, trade_date, knowledge_date) 重复"

  - rule: type_check
    columns:
      instrument_id: int
      trade_date: date
      knowledge_date: date
      net_mf_amount: float
      net_mf_vol: float
    message: "字段类型不匹配"

# 业务类: 业务规则（写入时警告但不阻断）
business: []

# 统计类: 批量统计检查（L3，交易日历完整性，#511 单标的维度）
statistical:
  - rule: completeness
    expected_dates: trade_calendar
    lookback_days: 5
    group_by_instrument: true
    message: "moneyflow 交易日覆盖不完整"
