# 指数权重 DQ 规则
dataset: index_weight
description: "指数成分股权重数据质量检查规则"

# 技术类: 技术校验（写入时强制阻断）
# 列名写 gate 帧实际形态（index_code/source_ticker，源帧在 instrument_id
# 富集之前过闸）；引用不存在列的规则被 checker 静默跳过，等于无效配置
# （#515 G2 修复：原 index_instrument_id/constituent_instrument_id 三条
# 规则从未生效过）。
technical:
  - rule: not_null
    columns: [index_code, source_ticker, trade_date, weight]
    message: "必填字段不能为空"

  - rule: unique
    columns: [index_code, source_ticker, trade_date]
    message: "主键 (index_code, source_ticker, trade_date) 重复"

  # FK 校验（指数/成分股 → instrument）需要 reference_values 接线
  # （technical checker 无 context 即跳过，#513 边界），不在本文件声明。
  # 权重总和守卫在写入路径 _validate_index_weight_totals（data_writer），
  # 不用业务表达式重复声明。

# 业务类: 业务规则（写入时警告但不阻断）
business:
  - rule: range_check
    column: weight
    min: 0.0
    max: 1.0
    severity: warning
    message: "权重必须在 [0, 1] 范围内"

# 统计类: 统计异常（定时批量检查）
statistical:
  - rule: completeness
    name: missing_index_weights
    expected_dates: "trade_calendar"
    lookback_days: 5
    message: "最近 5 个交易日存在缺失的指数权重数据"
