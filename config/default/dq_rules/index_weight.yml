# 指数权重 DQ 规则
dataset: index_weight
description: "指数成分股权重数据质量检查规则"

# 技术类: 技术校验（写入时强制阻断）
technical:
  - rule: not_null
    columns: [index_instrument_id, constituent_instrument_id, trade_date, weight]
    message: "必填字段不能为空"

  - rule: unique
    columns: [index_instrument_id, constituent_instrument_id, trade_date]
    message: "主键 (index_instrument_id, constituent_instrument_id, trade_date) 重复"

  - rule: foreign_key
    column: index_instrument_id
    reference: instrument.instrument_id
    message: "指数 Instrument ID 不存在于证券主表"

  - rule: foreign_key
    column: constituent_instrument_id
    reference: instrument.instrument_id
    message: "成分股 Instrument ID 不存在于证券主表"

  - rule: type_check
    columns:
      index_instrument_id: int
      constituent_instrument_id: int
      trade_date: date
      weight: float
    message: "字段类型不匹配"

# 业务类: 业务规则（写入时警告但不阻断）
business:
  - rule: range_check
    column: weight
    min: 0.0
    max: 1.0
    severity: warning
    message: "权重必须在 [0, 1] 范围内"

  - rule: expression
    name: sum_weight_by_index
    expr: "SUM(weight) OVER (PARTITION BY index_instrument_id, trade_date) BETWEEN 0.95 AND 1.05"
    severity: warning
    message: "指数权重总和应接近 1.0（允许 5% 误差）"

# 统计类: 统计异常（定时批量检查）
statistical:
  - rule: completeness
    name: missing_index_weights
    expected_dates: "trade_calendar"
    lookback_days: 5
    message: "最近 5 个交易日存在缺失的指数权重数据"

  - rule: consistency
    name: constituent_count_change
    max_change_ratio: 0.5  # 成分股数量变化不超过 50%
    message: "成分股数量异常变化（可能需要调仓确认）"
