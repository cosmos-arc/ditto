# 资产负债表 DQ 规则
dataset: balance_sheet
description: "资产负债表数据质量检查规则"

# 技术类: 技术校验（写入时强制阻断）
technical:
  - rule: not_null
    columns: [source_ticker, report_date]
    message: "必填字段不能为空"

  - rule: unique
    columns: [source_ticker, report_date, effective_from]
    message: "主键 (source_ticker, report_date, effective_from) 重复"

  - rule: type_check
    columns:
      report_date: date
      knowledge_date: date
      effective_from: date
      effective_to: date
      total_assets: float
      total_liabilities: float
      net_assets: float
      current_assets: float
      current_liabilities: float
    message: "字段类型不匹配"

# 业务类: 业务规则（写入时警告但不阻断）
business:
  - rule: positive
    columns: [total_assets, net_assets]
    message: "总资产、净资产必须为正数"

  - rule: expression
    name: asset_liability_relation
    expr: "total_assets >= total_liabilities"
    message: "总资产不应小于总负债（资不抵债需关注）"

# 统计类: 跨源对账（#473）
statistical:
  # 主源 Tushare 资产负债表 vs 辅源 fuyao 资产负债表数值交叉。
  # 两侧金额均为元；fuyao 无流动负债合计对应字段（current_liabilities
  # 不注册比较）、cash=货币资金映射 money_cap，语义差异以字段映射显式单列。
  # 口径（2026-10-05 实测茅台 2025 年末）：net_assets=Tushare
  # total_hldr_eqy_exc_min_int（归母权益 2446.4 亿）≠ fuyao
  # holder_equity_total（所有者权益合计 2539.6 亿，差 93.2 亿=少数股东
  # 权益）——非同科目且主源无含少数权益字段，不可换算，不注册比较。
  - rule: cross_source_compare
    key_columns: [instrument_id, report_date]
    fields: [total_assets, total_liabilities, current_assets]
    tolerance_rules:
      total_assets:
        method: relative
        relative_tol: 0.0001
      total_liabilities:
        method: relative
        relative_tol: 0.0001
      current_assets:
        method: relative
        relative_tol: 0.0001
    message: "与辅源(fuyao)资产负债表数值交叉发现差异"
    enabled: true
