# 利润表 DQ 规则
dataset: income_statement
description: "利润表数据质量检查规则"

# 技术类: 技术校验（写入时强制阻断）
technical:
  - rule: not_null
    columns: [instrument_id, report_date]
    message: "必填字段不能为空"

  - rule: unique
    columns: [instrument_id, report_date, effective_from]
    message: "主键 (instrument_id, report_date, effective_from) 重复"

  - rule: foreign_key
    column: instrument_id
    reference: instrument.instrument_id
    message: "Instrument ID 不存在于证券主表"

  - rule: type_check
    columns:
      instrument_id: int
      report_date: date
      knowledge_date: date
      effective_from: date
      effective_to: date
      revenue: float
      operating_profit: float
      net_profit: float
      eps: float
    message: "字段类型不匹配"

# 业务类: 业务规则（写入时警告但不阻断）
business:
  - rule: range_check
    column: revenue
    min: 0
    message: "营业收入不应为负数"

# 统计类: 跨源对账（#473）
statistical:
  # 主源 Tushare 利润表 vs 辅源 fuyao 利润表数值交叉。
  # 两侧金额均为元（无单位换算）；金额相对容差 1e-4（实测茅台精确到分、
  # 部分银行年报值舍入到百万级——相对容差下两者均可判定）；
  # eps 为元/股小量纲字段，不做单位换算，绝对容差 0.005 = 2 位小数舍入。
  # 口径（2026-10-05 实测）：operating_revenue=营业收入（Tushare `revenue` 字段）
  # ↔ fuyao operating_income 同科目，茅台 2025 年报两侧逐位一致
  # (168,838,102,514.79)；内部 revenue 列=营业总收入（含财务公司利息收入
  # 等金融科目，茅台 2025 差 32.16 亿），与营业收入非同科目——不注册比较，
  # 也不折算（差额无公开科目级对应，属同一财报两个行项目）。
  # vintage：fuyao report_date 仅最新一期为该期披露日，历史期错挂最近同型
  # 报告披露日（实测 2025-06-30 行挂 2026-08-15）；披露日不一致的行由
  # handler 单列 vintage_mismatch 不做数值比较（数值实测同代，见票评论）。
  - rule: cross_source_compare
    key_columns: [instrument_id, report_date]
    fields: [operating_revenue, operating_profit, net_profit, eps]
    tolerance_rules:
      operating_revenue:
        method: relative
        relative_tol: 0.0001
      operating_profit:
        method: relative
        relative_tol: 0.0001
      net_profit:
        method: relative
        relative_tol: 0.0001
      eps:
        method: absolute
        absolute_tol: 0.005
    message: "与辅源(fuyao)利润表数值交叉发现差异"
    enabled: true
