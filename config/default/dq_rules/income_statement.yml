# 利润表 DQ 规则
dataset: income_statement
description: "利润表数据质量检查规则"

# 技术类: 技术校验（写入时强制阻断）
technical:
  - rule: not_null
    columns: [instrument_id, report_date]
    message: "必填字段不能为空"

  - rule: unique
    columns: [instrument_id, report_date, effective_from]
    message: "主键 (instrument_id, report_date, effective_from) 重复"

  - rule: foreign_key
    column: instrument_id
    reference: instrument.instrument_id
    message: "Instrument ID 不存在于证券主表"

  - rule: type_check
    columns:
      instrument_id: int
      report_date: date
      knowledge_date: date
      effective_from: date
      effective_to: date
      revenue: float
      operating_profit: float
      net_profit: float
      eps: float
    message: "字段类型不匹配"

# 业务类: 业务规则（写入时警告但不阻断）
business:
  - rule: range_check
    column: revenue
    min: 0
    message: "营业收入不应为负数"
