# 涨跌停价格 DQ 规则（#517 stk_limit）
# 单位口径（#506 坑 F 登记）：up_limit/down_limit 单位为元（Tushare stk_limit
# 专页口径），与前收盘价同单位；跨端点比较时不得与 daily_basic.total_mv（万元）
# 等其他端点单位混用。
dataset: stock_limit
description: "股票涨跌停价格数据质量检查规则"

# 技术类: 技术校验（写入时强制阻断）
technical:
  - rule: not_null
    columns: [source_ticker, trade_date, knowledge_date]
    message: "必填字段不能为空"

  - rule: unique
    columns: [source_ticker, trade_date, knowledge_date]
    message: "主键 (source_ticker, trade_date, knowledge_date) 重复"

  - rule: type_check
    columns:
      instrument_id: int
      trade_date: date
      knowledge_date: date
      up_limit: float
      down_limit: float
    message: "字段类型不匹配"

# 业务类: 业务规则（写入时警告但不阻断）
business:
  - rule: positive
    columns: [up_limit, down_limit]
    message: "涨停价/跌停价必须为正数"

# 统计类: 批量统计检查（L3，交易日历完整性）
statistical:
  - rule: completeness
    expected_dates: trade_calendar
    lookback_days: 5
    message: "涨跌停价格交易日覆盖不完整"
