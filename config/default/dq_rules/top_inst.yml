# 龙虎榜席位明细 DQ 规则（#519）
# 单位：金额元、比率 %；side '0'=买 '1'=卖。exalter+side+reason 进主键。
# 事件型，勿套用日历完整性。
dataset: top_inst
description: "top_inst 数据质量检查规则"

technical:
  - rule: not_null
    columns: [instrument_id, trade_date, exalter, side, reason, knowledge_date]
    message: "必填字段不能为空"

  - rule: unique
    columns: [instrument_id, trade_date, exalter, side, reason, knowledge_date]
    message: "主键 (instrument_id, trade_date, exalter, side, reason, knowledge_date) 重复"

  - rule: foreign_key
    column: instrument_id
    reference: instrument.instrument_id
    message: "Instrument ID 不存在于证券主表"

  - rule: type_check
    columns:
      instrument_id: int
      trade_date: date
      knowledge_date: date
      exalter: string
      side: string
      reason: string
      buy: float
    message: "字段类型不匹配"

# 业务类: 业务规则（写入时警告但不阻断）
business: []
