    asset_type: "stock"
    exchange: "XSHG"
    tags: ["大盘", "通信", "高流动性", "主板"]

  # ========================================
  # 股票 - 创业板/科创板
  # ========================================
  - ticker: "300750"
    name: "宁德时代"
    asset_type: "stock"
    exchange: "XSHE"
    tags: ["大盘", "新能源", "高流动性", "创业板"]

  - ticker: "688981"
    name: "中芯国际"
    asset_type: "stock"
    exchange: "XSHG"
    tags: ["大盘", "半导体", "中流动性", "科创板"]

  # ========================================
