# 黄金数据集配置 - 用于每日对账的精选标的
# 覆盖维度：流动性分层、市场板块、资产类型、特殊场景
# 详见 docs/design/13_golden_dataset_design.md

description: "黄金数据集 - A股多维度覆盖（21个标的）"

# 资产类别说明：
# - stock: A股股票
# - etf: ETF基金（宽基/行业/跨境）
# - index_market: 市场指数（上证/深证/沪深300等）
# - index_sw: 申万行业指数（801xxx）
# - index_style: 风格指数（价值/成长/红利）
#
# 交易所代码说明（内部规范）：
# - XSHG: 上海证券交易所
# - XSHE: 深圳证券交易所
# - SW: 申万指数

tickers:
  # ========================================
  # 股票 - 高流动性大盘
  # ========================================
  - ticker: "600519"
    name: "贵州茅台"
    asset_type: "stock"
    exchange: "XSHG"
    tags: ["大盘", "白酒", "高流动性", "主板"]

  - ticker: "600036"
    name: "招商银行"
    asset_type: "stock"
    exchange: "XSHG"
    tags: ["大盘", "银行", "高流动性", "主板"]

  - ticker: "000333"
    name: "美的集团"
    asset_type: "stock"
    exchange: "XSHE"
    tags: ["大盘", "家电", "高流动性", "主板"]

  - ticker: "600941"
