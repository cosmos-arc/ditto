  # ========================================
  # 指数 - 市场基准
  # ========================================
  - ticker: "000001"
    name: "上证指数"
    asset_type: "index_market"
    exchange: "XSHG"
    tags: ["市场基准", "上证"]

  - ticker: "399001"
    name: "深证成指"
    asset_type: "index_market"
    exchange: "XSHE"
    tags: ["市场基准", "深证"]

  - ticker: "000300"
    name: "沪深300"
    asset_type: "index_market"
    exchange: "XSHG"
    tags: ["宽基指数", "大盘"]

  - ticker: "000852"
    name: "中证1000"
    asset_type: "index_market"
    exchange: "XSHG"
    tags: ["宽基指数", "小盘"]

options:
  enabled: true
  # 动态标的配置（可选）
  dynamic:
    # 纳入次新股（上市60天内）
    include_new_stocks: false
    new_stock_days: 60
    # 纳入ST股
    include_st: true
    # 纳入停牌股
    include_suspended: false
