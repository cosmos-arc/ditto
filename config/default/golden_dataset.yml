# 黄金数据集配置 - 用于每日对账的精选标的
# 覆盖维度：流动性分层、市场板块、资产类型、特殊场景
# 详见 docs/design/13_golden_dataset_design.md

description: "黄金数据集 - A股多维度覆盖（25个标的）"

tickers:
  # === 流动性分层 - 股票 ===
  # 高流动性-大盘
  - "600519"  # 贵州茅台 - 白酒龙头
  - "600036"  # 招商银行 - 银行龙头
  - "000333"  # 美的集团 - 家电龙头
  - "600941"  # 中国移动 - 通信龙头

  # 创业板/科创板代表
  - "300750"  # 宁德时代 - 创业板龙头
  - "688981"  # 中芯国际 - 科创板代表

  # 中低流动性
  - "000710"  # 贝瑞基因 - 中流动性
  - "300736"  # *ST左江 - ST股场景

  # === ETF - 宽基 ===
  - "510300"  # 沪深300ETF - 基准
  - "510500"  # 中证500ETF - 中盘
  - "159915"  # 创业板ETF - 创业板
  - "588000"  # 科创50ETF - 科创板

  # === ETF - 行业/跨境 ===
  - "159928"  # 消费ETF - 行业
  - "512010"  # 医药ETF - 行业
  - "513100"  # 纳指ETF - 跨境QDII
  - "513030"  # 德国ETF - 跨境
  - "516010"  # 游戏ETF - 低流动性ETF

  # === 指数 ===
  - "000001"  # 上证指数 - 市场基准
  - "399001"  # 深证成指 - 深市基准
  - "000300"  # 沪深300 - 宽基指数
  - "000852"  # 中证1000 - 小盘指数

  # === 特殊场景（示例）===
  # - "动态选择"  # 长期停牌股
  # - "动态选择"  # 次新股
  # - "动态选择"  # 退市整理股

options:
  enabled: true
  # 动态标的配置（可选）
  dynamic:
    # 纳入次新股（上市60天内）
    include_new_stocks: false
    new_stock_days: 60
    # 纳入ST股
    include_st: true
    # 纳入停牌股
    include_suspended: false
