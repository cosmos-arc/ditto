    exchange: "XSHG"
    tags: ["宽基", "高流动性", "科创板"]

  # ========================================
  # ETF - 行业/跨境
  # ========================================
  - ticker: "159928"
    name: "消费ETF"
    asset_type: "etf"
    exchange: "XSHE"
