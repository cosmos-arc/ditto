  - ticker: "300736"
    name: "*ST左江"
    asset_type: "stock"
    exchange: "XSHE"
    tags: ["小盘", "ST", "低流动性", "创业板", "风险场景"]

  # ========================================
  # ETF - 宽基
  # ========================================
  - ticker: "510300"
    name: "沪深300ETF"
    asset_type: "etf"
    exchange: "XSHG"
    tags: ["宽基", "高流动性", "沪深300"]

  - ticker: "510500"
