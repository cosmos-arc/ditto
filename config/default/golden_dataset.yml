    tags: ["跨境", "QDII", "纳斯达克", "中流动性"]

  - ticker: "513030"
    name: "德国ETF"
    asset_type: "etf"
    exchange: "XSHG"
    tags: ["跨境", "QDII", "德国DAX", "低流动性"]

  - ticker: "516010"
