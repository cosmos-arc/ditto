[project]
name = "ditto-apps"
requires-python = ">= 3.13"
version = "0.1.0"
dependencies = [
    "ditto-agent",
    "ditto-analysis",
    "ditto-application",
    "ditto-backtest",
    "ditto-data",
    "ditto-execution",
    "ditto-features",
    "ditto-kernel",
    "ditto-platform",
    "ditto-portfolio",
    "ditto-risk",
    "ditto-strategy",
    "click",
    "dishka",
    "fastapi",
    "granian",
    "loguru",
    "orjson",
    "polars",
    "prefect",
    "pydantic",
    "python-dotenv",
    "rich",
    "starlette",
    "typer",
]

[project.scripts]
server = "ditto_apps.server:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ditto_apps.registry.infra.notification_templates" = ["*.j2"]
