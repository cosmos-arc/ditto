# Pre-commit hooks configuration
# See https://pre-commit.com for more information

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.8
    hooks:
      # Ruff Lint - 严格检查代码质量问题
      - id: ruff
        args: [--fix, --show-fixes]  # Auto-fix issues and show what was fixed
        # 每次提交前检查所有文件，不仅仅是修改的文件
        pass_filenames: false
        always_run: true
        # 如果有无法自动修复的问题，提交会失败
        fail_fast: true
      # Ruff Format - 代码格式化
      - id: ruff-format
        args: [--diff]  # Show diff of formatting changes
        pass_filenames: false
        always_run: true

  - repo: local
    hooks:
      - id: pytest-check
        name: pytest-check
        entry: pixi run python -m pytest
        language: system
        pass_filenames: false
        always_run: true
        # Run pytest on committed files
        files: ^tests/.*\.py$|^packages/.*\.py$|^apps/.*\.py$

# Exclude directories
exclude: |
  (?x)^(
    \.git/|
    \.pixi/|
    __pycache__/|
    \.pytest_cache/|
    \.mypy_cache/|
    \.coverage/|
    htmlcov/|
    \.tox/|
    build/|
    dist/|
    \.venv/
  )$

# Minimum pre-commit version
minimum_pre_commit_version: 2.20.0