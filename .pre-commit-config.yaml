# .pre-commit-config.yaml (Local Mode)
#
# 设计原则：
# - 所有 Python 工具使用 local 模式，通过 pixi run 调用
# - 确保 pre-commit、CI、开发环境使用完全相同的工具版本
# - Pyright 放在 CI 中运行（避免 pre-commit 隔离环境的依赖问题）
#
# 安装: pixi run pre-commit-install

minimum_pre_commit_version: "2.20.0"
default_stages: [pre-commit]

repos:
  # ==========================================================
  # 基础检查（纯文件检查，无需 Python 环境）
  # ==========================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: debug-statements
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main]

  # ==========================================================
  # Python 工具 - Local 模式
  # ==========================================================
  - repo: local
    hooks:
      # Ruff Lint Fix（先修复）
      - id: ruff-lint-fix
        name: ruff lint (fix)
        entry: pixi run -e dev lint --fix
        language: system
        types: [python]
        require_serial: false

      # Ruff Format（再格式化）
      - id: ruff-format
        name: ruff format
        entry: pixi run -e dev fmt
        language: system
        types: [python]
        require_serial: false

      - id: pyright
        name: pyright (src, warnings=fail)
        entry: pixi run -e dev type
        language: system
        pass_filenames: false
        require_serial: true

      # --------------------------------------------------------
      # pytest (pre-push 阶段)
      # --------------------------------------------------------
      - id: pytest-fast
        name: pytest (fast)
        entry: pixi run -e dev test --fast
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-push]

  # ==========================================================
  # 敏感信息检测
  # ==========================================================
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # ==========================================================
  # Commit Message 规范
  # ==========================================================
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - feat
          - fix
          - docs
          - style
          - refactor
          - perf
          - test
          - build
          - ci
          - chore
          - revert
          - wip

# ==========================================================
# 全局排除
# ==========================================================
exclude: |
  (?x)^(
    \.pixi/|
    __pycache__/|
    \.pytest_cache/|
    \.ruff_cache/|
    htmlcov/|
    \.tox/|
    build/|
    dist/|
    \.venv/|
    node_modules/|
    data/
  )

# ==========================================================
# CI 集成配置
# ==========================================================
ci:
  skip:
    # CI 中跳过这些（由 GitHub Actions 单独运行）
    - ruff-lint
    - ruff-format
    - pyright
    - pytest-fast
    - gitleaks
  autoupdate_schedule: monthly
  autoupdate_commit_msg: "chore(deps): update pre-commit hooks"
