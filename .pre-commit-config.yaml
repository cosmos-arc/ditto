# Pre-commit hooks configuration
# See https://pre-commit.com for more information

minimum_pre_commit_version: "2.20.0"

repos:
  # 一些通用基础检查
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml # NEW: 顺带帮你检查 pyproject 等 toml 文件
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: debug-statements

  # Ruff: lint + format
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.12
    hooks:
      # Ruff Lint - 严格检查代码质量问题
      - id: ruff
        # 自动修复能修的，同时如果有修复发生让命令返回非 0，提醒你重新 git add
        args: [--fix, --exit-non-zero-on-fix, --show-fixes]
        # 使用默认按文件运行即可，避免每次提交都全仓扫描太慢
        # pass_filenames: false
        # always_run: true
        # fail_fast 默认就是 true，这里不再显式设置

      # Ruff Format - 代码格式化
      - id: ruff-format
        # 一般这里不需要 --diff，直接在本地改文件即可
        # 如果你更喜欢只看 diff 再手动处理，可以改成 ["--check"]
        # args: ["--check"]
        pass_filenames: true

  # Mypy: 严格类型检查（配合你 pyproject 里的 strict + pydantic.mypy 插件）
  # TODO: 临时禁用，修复类型错误后重新启用
  # - repo: https://github.com/pre-commit/mirrors-mypy
  #   rev: v1.13.0
  #   hooks:
  #     - id: mypy
  #       # 这里用 pre-commit 自建 env，比系统 mypy 更可控
  #       additional_dependencies:
  #         - pydantic>=2.0
  #         # 如果你用到了 pydantic-settings / pydantic-core 等，也可以加在这里
  #         # - pydantic-settings>=2.0
  #       args: [--no-error-summary]

  # 可选：本地 pytest 钩子（临时禁用，测试通过后再启用）
  # - repo: local
  #   hooks:
  #     - id: pytest-fast
  #       name: pytest (fast subset)
  #       entry: pixi run python -m pytest -m "not slow and not integration" --no-cov
  #       language: system
  #       pass_filenames: false
  #       types: [python]
  #       stages: [pre-commit]

# 全局排除目录（正则）
exclude: |
  (?x)^(
    \.git/|
    \.pixi/|
    __pycache__/|
    \.pytest_cache/|
    \.mypy_cache/|
    \.ruff_cache/|
    \.coverage/|
    htmlcov/|
    \.tox/|
    build/|
    dist/|
    \.venv/
  )$
