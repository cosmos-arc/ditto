# .pre-commit-config.yaml (Local Mode)
#
# 设计原则：
# - 所有 Python 工具使用 local 模式，通过 uv run --no-sync 调用
# - 确保 pre-commit、CI、开发环境使用完全相同的工具版本
# - Pyright 放在 CI 中运行（避免 pre-commit 隔离环境的依赖问题）
#
# 安装: task pre-commit-install

minimum_pre_commit_version: "4.0.0"
default_stages: [pre-commit]

repos:
  # ==========================================================
  # 基础检查（纯文件检查，无需 Python 环境）
  # ==========================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        # Evidence JSON is immutable/content-addressed; EOF changes invalidate
        # its recorded SHA-256 identity. Keep JSON validation and secret scans.
        exclude: >-
          ^(?:artifacts/acceptance/(?:r2-report(?:\.manifest)?|r2-live-evidence/[^/]+)\.json|docs/evidence/.*\.json)$
      - id: check-yaml
        args: [--unsafe]
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-case-conflict
      - id: check-merge-conflict
      # Symlink/mode hygiene at commit time: mode anomalies otherwise silently
      # degrade the pre-push scope ladder to the full `task check` gate.
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: debug-statements
      - id: no-commit-to-branch
        args: [--branch, main]

  # ==========================================================
  # Python 工具 - Local 模式
  # ==========================================================
  - repo: local
    hooks:
      # Ruff Lint Fix（先修复）
      - id: ruff-lint-fix
        name: ruff lint (fix)
        entry: uv run --no-sync ruff check --fix
        language: system
        types: [python]
        require_serial: false

      # Ruff Format（再格式化）
      - id: ruff-format
        name: ruff format
        entry: uv run --no-sync ruff format
        language: system
        types: [python]
        require_serial: false

      # --------------------------------------------------------
      # pre-push 阶段：推送身份/范围核对 + 显式验证提示（#340）。
      # 重型验证不进入同步 push 路径；送审前用 task verify-push。
      # --------------------------------------------------------
      - id: pytest-fast
        name: verify push identity and scope
        entry: uv run --no-sync python -m tooling.agent_harness.pre_push
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

  # ==========================================================
  # 敏感信息检测（唯一权威扫描器；私钥检测由 gitleaks 规则集覆盖）
  # 本地与 CI 固定同一版本（见 docs/engineering/agent-harness.md）。
  # ==========================================================
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # ==========================================================
  # Commit Message 规范
  # ==========================================================
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - feat
          - fix
          - docs
          - style
          - refactor
          - perf
          - test
          - build
          - ci
          - chore
          - revert
          - wip

# ==========================================================
# 全局排除
# ==========================================================
exclude: |
  (?x)^(
    __pycache__/|
    \.pytest_cache/|
    \.ruff_cache/|
    htmlcov/|
    \.tox/|
    build/|
    dist/|
    \.venv/|
    node_modules/|
    data/
  )

# pre-commit.ci 服务未安装；hook 版本经 `task pre-commit-update` 手动升级，
# 不保留仅对该服务生效的 ci: 配置段。
