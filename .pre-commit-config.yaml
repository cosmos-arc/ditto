# .pre-commit-config.yaml (Local Mode)
#
# 设计原则：
# - 所有 Python 工具使用 local 模式，通过 pixi run 调用
# - 确保 pre-commit、CI、开发环境使用完全相同的工具版本
# - 非 Python 工具（如 gitleaks）仍使用远程 repo
#
# 安装: pixi run pre-commit install --hook-type commit-msg --hook-type pre-commit

minimum_pre_commit_version: "2.20.0"
default_stages: [pre-commit]

repos:
  # ==========================================================
  # 基础检查（这些是纯文件检查，无需 Python 环境）
  # ==========================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: debug-statements
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main]

  # ==========================================================
  # Python 工具 - 全部使用 Local 模式
  # ==========================================================
  - repo: local
    hooks:
      # --------------------------------------------------------
      # Ruff Lint
      # --------------------------------------------------------
      - id: ruff-lint
        name: ruff lint
        entry: pixi run ruff check --fix --exit-non-zero-on-fix --show-fixes
        language: system
        types: [python]
        require_serial: false # 可并行

      # --------------------------------------------------------
      # Ruff Format
      # --------------------------------------------------------
      - id: ruff-format
        name: ruff format
        entry: pixi run ruff format
        language: system
        types: [python]
        require_serial: false

      # --------------------------------------------------------
      # Mypy Type Check
      # --------------------------------------------------------
      - id: mypy
        name: mypy
        entry: pixi run mypy
        language: system
        types: [python]
        # 只检查源码，排除测试
        files: ^(packages|apps/server)/.*\.py$
        exclude: ^(tests/|.*/tests/|.*_test\.py$|conftest\.py$)
        require_serial: true # Mypy 需要串行以利用缓存
        args:
          - --no-error-summary
          - --cache-dir=.mypy_cache

      # --------------------------------------------------------
      # Bandit Security Scan
      # --------------------------------------------------------
      - id: bandit
        name: bandit
        entry: pixi run bandit
        language: system
        types: [python]
        files: ^(packages|apps/server)/.*\.py$
        exclude: ^(tests/|.*/tests/|.*_test\.py$|conftest\.py$)
        args:
          - -c
          - pyproject.toml
          - --severity-level=medium
          - --confidence-level=medium
          - --quiet

      # --------------------------------------------------------
      # pytest (可选 - pre-push 阶段)
      # --------------------------------------------------------
      - id: pytest-fast
        name: pytest (fast)
        entry: pixi run pytest
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push] # 只在 push 时运行，不阻塞 commit
        args:
          - -m
          - "not slow and not integration and not e2e and not external"
          - --no-cov
          - -q
          - --tb=no

  # ==========================================================
  # 敏感信息检测（二进制工具，使用远程 repo）
  # ==========================================================
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # ==========================================================
  # Commit Message 规范
  # ==========================================================
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - feat
          - fix
          - docs
          - style
          - refactor
          - perf
          - test
          - build
          - ci
          - chore
          - revert
          - wip

# ==========================================================
# 全局排除
# ==========================================================
exclude: |
  (?x)^(
    \.git/|
    \.pixi/|
    __pycache__/|
    \.pytest_cache/|
    \.mypy_cache/|
    \.ruff_cache/|
    \.coverage/|
    htmlcov/|
    \.tox/|
    build/|
    dist/|
    \.venv/|
    node_modules/|
    apps/web/\.next/|
    data/|
    \.pixi/
  )$

# ==========================================================
# CI 集成配置
# ==========================================================
ci:
  skip:
    # CI 中跳过这些（由 GitHub Actions 单独运行）
    - ruff-lint
    - ruff-format
    - mypy
    - bandit
    - pytest-fast
    - gitleaks
  autoupdate_schedule: monthly
  autoupdate_commit_msg: "chore(deps): update pre-commit hooks"
