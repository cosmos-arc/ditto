# Vector 配置文件 - Ditto 可观测性系统
# 功能: 从应用日志文件采集日志并推送到 VictoriaLogs

# ============ 数据源 ============

# API 日志源
[sources.api_logs]
type = "file"
include = ["/logs/api/*.jsonl", "/logs/api/*.json"]
read_from = "end"

# Job 日志源
[sources.job_logs]
type = "file"
include = ["/logs/job/*.jsonl", "/logs/job/*.json"]
read_from = "end"

# 兼容旧格式(单一日志目录)
[sources.legacy_logs]
type = "file"
include = ["/logs/ditto*.jsonl"]
read_from = "end"

# ============ 数据转换 ============

# API 日志转换
[transforms.api_logs_transform]
type = "remap"
inputs = ["api_logs"]
source = '''
. = parse_json!(.message)
.source = "ditto-api"
'''

# Job 日志转换
[transforms.job_logs_transform]
type = "remap"
inputs = ["job_logs"]
source = '''
. = parse_json!(.message)
.source = "ditto-job"
'''

# 兼容旧格式转换
[transforms.legacy_logs_transform]
type = "remap"
inputs = ["legacy_logs"]
source = '''
. = parse_json!(.message)
'''

# ============ 数据汇 - VictoriaLogs ============

[sinks.victorialogs]
type = "http"
inputs = ["api_logs_transform", "job_logs_transform", "legacy_logs_transform"]
uri = "http://victorialogs:9428/insert/jsonline?_stream_fields=source"
encoding.codec = "json"
framing.method = "newline_delimited"
batch.max_events = 100

# ============ 健康检查 ============

[api]
enabled = true
address = "0.0.0.0:8686"
