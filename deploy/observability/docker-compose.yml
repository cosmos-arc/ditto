# Ditto 可观测性系统 - Docker Compose 配置
# 版本: v1.0.0
# 说明: 部署 VictoriaMetrics、VictoriaLogs、Vector、Grafana

services:
  # VictoriaMetrics - Metrics 存储与 OTLP 接收
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.104.0@sha256:4a03f2881108571949f83764069f5ecc325de5cbbae676c2742f0a2e7523a682
    container_name: ditto-vm
    ports:
      - "127.0.0.1:8428:8428"
    command:
      - "--storageDataPath=/vmdata"
      - "--retentionPeriod=90d"
    volumes:
      - vm-data:/vmdata
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  # VictoriaLogs - Logs 存储与查询
  victorialogs:
    image: victoriametrics/victoria-logs:v1.37.0@sha256:f315b6153ab8749393e6b6c4844f0bf60707703d4e006d89f78eed9abdfaf843
    container_name: ditto-vl
    ports:
      - "127.0.0.1:9428:9428"
    command:
      - "--storageDataPath=/vldata"
      - "--retentionPeriod=30d"
    volumes:
      - vl-data:/vldata
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  # Vector - 日志采集
  vector:
    image: timberio/vector:0.52.0-debian@sha256:ee3b99e52896fde12d1b07774826c8e58b07b4a995c3a5a624cc268a69ad7572
    container_name: ditto-vector
    ports:
      - "127.0.0.1:8686:8686"
    command:
      - "--config"
      - "/etc/vector/vector.toml"
    volumes:
      - ./vector.toml:/etc/vector/vector.toml:ro
      - ${DITTO_LOGS_PATH:-/opt/ditto/logs}:/logs:ro
    depends_on:
      - victorialogs
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

  # Grafana - 可视化仪表盘
  grafana:
    image: grafana/grafana:11.1.0@sha256:079600c9517b678c10cda6006b4487d3174512fd4c6cface37df7822756ed7a5
    container_name: ditto-grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_INSTALL_PLUGINS=victoriametrics-logs-datasource
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=victoriametrics-logs-datasource
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - victoriametrics
      - victorialogs
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  vm-data:
  vl-data:
  grafana-data:
