[project]
name = "ditto-analysis"
requires-python = ">= 3.13"
version = "0.1.0"
dependencies = [
    "ditto-kernel",
    "ditto-platform",
    "polars",
    "orjson",
    "dishka",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
"ditto_analysis.storage.sqlite.experiments" = ["schema_v1.sql"]
