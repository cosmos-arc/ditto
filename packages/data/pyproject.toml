[project]
name = "ditto-data"
requires-python = ">= 3.13"
version = "0.1.0"
dependencies = [
    "ditto-kernel",
    "ditto-platform",
    "ditto-features",
    "ditto-strategy",
    "ditto-analysis",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
