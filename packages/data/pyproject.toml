[project]
name = "ditto-data"
requires-python = ">= 3.13"
version = "0.1.0"
dependencies = [
    "ditto-kernel",
    "ditto-platform",
    "PyYAML",
    "dishka",
    "duckdb",
    "httpx",
    "limits",
    "loguru",
    "orjson",
    "polars",
    "pydantic",
    "tenacity",
    "xxhash",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
"ditto_data.scripts" = ["schema.sql"]
