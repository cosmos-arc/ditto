[project]
name = "ditto-application"
requires-python = ">= 3.13"
version = "0.1.0"
dependencies = [
    "ditto-kernel",
    "ditto-data",
    "ditto-engine",
    "ditto-analytics",
    "ditto-platform",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
