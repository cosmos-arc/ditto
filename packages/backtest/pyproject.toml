[project]
name = "ditto-backtest"
requires-python = ">= 3.13"
version = "0.1.0"
dependencies = [
    "ditto-kernel",
    "ditto-data",
    "ditto-strategy",
    "ditto-portfolio",
    "ditto-risk",
    "ditto-execution",
    "polars",
    "numpy",
    "orjson",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
