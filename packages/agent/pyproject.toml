[project]
name = "ditto-agent"
requires-python = ">= 3.13"
version = "0.1.0"
dependencies = [
    "ditto-application",
    "ditto-platform",
    "openai-agents>=0.20.0,<0.21",
    "orjson",
    "pydantic",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
"ditto_agent.storage.sqlite" = ["schema_v1.sql"]
"ditto_agent.evals" = ["datasets/grounded/*.json"]
