# 数据源配置文件
# 支持环境变量替换: ${VAR_NAME} 或 ${VAR_NAME:default_value}

# 主数据源配置
primary:
  type: "tushare"  # 主数据源类型
  enabled: true
  config:
    token: "${TUSHARE_TOKEN}"  # 从环境变量读取
    api_url: "https://api.tushare.pro"
    rate_limit: 200  # 每分钟请求次数限制
    timeout: 30  # 请求超时时间(秒)
    max_retries: 3  # 最大重试次数
    retry_delay: 1  # 重试延迟(秒)

# 备用数据源配置
backup:
  type: "akshare"  # 备用数据源类型
  enabled: true
  config:
    timeout: 30
    user_agent: "Ditto/1.0"
    max_retries: 2
    retry_delay: 2

# 测试数据源配置
test:
  type: "csv"  # CSV测试数据源
  enabled: false
  config:
    data_dir: "${TEST_DATA_DIR:./data/test}"  # 默认值: ./data/test
    etf_list_file: "etf_list.csv"

# 数据采集配置
collection:
  batch_size: 1000  # 批量处理大小
  max_concurrent_fetches: 3  # 最大并发下载数
  validate_consistency: true  # 是否验证主备数据源一致性
  price_tolerance: 0.01  # 价格差异容忍度(1%)
  enable_cross_validation: true  # 启用交叉验证

# 数据更新策略
update_strategy:
  # ETF列表更新
  etf_list:
    enabled: true
    schedule: "0 2 * * *"  # 每天凌晨2点 (cron格式)
    retry_count: 3

  # 日线数据更新
  daily_data:
    enabled: true
    schedule: "30 15 * * *"  # 每天下午3:30 (A股收盘后)
    retry_count: 3
    lookback_days: 5  # 向前获取天数，确保数据完整性

  # 复权因子更新
  adj_factors:
    enabled: true
    schedule: "0 3 * * 0"  # 每周日凌晨3点
    retry_count: 3
    force_update: false  # 是否强制更新已有数据

# 数据质量配置
quality:
  # 价格验证
  price_validation:
    enabled: true
    min_price: 0.01  # 最小价格
    max_price: 10000  # 最大价格
    max_change_pct: 20  # 最大涨跌幅(%)，用于过滤异常数据

  # 成交量验证
  volume_validation:
    enabled: true
    min_volume: 0  # 最小成交量
    max_volume: 1000000000000  # 最大成交量

  # 连续性验证
  continuity_validation:
    enabled: true
    max_gap_days: 7  # 允许的最大数据间隔天数

  # 交叉验证
  cross_validation:
    enabled: true
    tolerance: 0.01  # 主备数据源价格差异容忍度
    min_samples: 10  # 最小样本数
