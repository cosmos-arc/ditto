# packages/platform/pyproject.toml
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ditto-platform"
requires-python = ">= 3.13"
version = "0.1.0"
dependencies = [
    "ditto-kernel",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
