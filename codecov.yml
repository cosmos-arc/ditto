codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: "80...100"
  status:
    project:
      backend:
        flags: [backend]
        target: 90%
        threshold: 0%
      backend-critical:
        flags: [backend-critical]
        target: 90%
        threshold: 0%
      web:
        flags: [web]
        target: 85%
        threshold: 0%
    patch:
      backend:
        flags: [backend]
        target: 90%
        threshold: 0%
      web:
        flags: [web]
        target: 90%
        threshold: 0%

flags:
  backend:
    paths:
      - apps/backend/src/
      - packages/
    carryforward: false
  backend-critical:
    paths:
      - packages/backtest/src/
      - packages/execution/src/
      - packages/portfolio/src/
      - packages/risk/src/
    carryforward: false
  web:
    paths:
      - apps/web/src/
    carryforward: false

ignore:
  - "**/tests/**"
  - "**/conftest.py"
  - "apps/web/src/api/generated/**"
  - "apps/web/src/routeTree.gen.ts"

comment:
  layout: "header,diff,flags,files"
  behavior: default
  require_changes: true
