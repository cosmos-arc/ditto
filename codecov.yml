# codecov.yml
# Ditto 覆盖率报告配置

coverage:
  precision: 2
  round: down
  range: "60...100"

  status:
    project:
      default:
        target: 80%
        threshold: 2%

    patch:
      default:
        target: 80%
        threshold: 0%

  flags:
    core-strategy:
      paths:
        - packages/engine/src/ditto_engine/alpha/
        - packages/engine/src/ditto_engine/portfolio/
      target: 90%

    data:
      paths:
        - packages/data/src/
      target: 85%

    infra:
      paths:
        - packages/infra/src/
      target: 80%

    server:
      paths:
        - interfaces/src/
      target: 80%

ignore:
  - "**/__init__.py"
  - "**/conftest.py"
  - "scripts/**"
  - "tests/**"
  - "**/migrations/**"

comment:
  layout: "header,diff,flags,files"
  behavior: default
  require_changes: true
